# Single source of truth for active subnet configuration. Miners, the trainer,
# and validators all read this file via cascade.shared.config. Schema is versioned.
# Rationale for these settings lives in docs/ (ARCHITECTURE.md, VALIDATOR.md).

schema_version = 1

[subnet]
netuid = 91                      # MAINNET netuid
name = "cascade"
description = "Synthetic time-series training data, KOTH on CRPS + MASE of a Toto2-4M trained from scratch."

[generator]
# Bounds the trainer enforces on every generator's output; a violation
# disqualifies the generator for the round.
corpus_n_series      = 16384     # legacy exact-count drain; superseded while corpus_target_points
                                 # is armed (below), still the probe/off-switch denomination
min_length           = 64        # per-series length band (timesteps)
max_length           = 4096      # keep in lockstep with [training] context_length
max_total_points     = 2_000_000_000
# Points-denominated materialised drain (DEC-CA-0031): the cache_reuse /
# `cascade verify` drain stops at this many cumulative values-points instead of
# at a fixed series count — 67_108_864 = 16384 × 4096, today's corpus size, but
# a miner may now spend it as 65k×1024 (or any shape inside the length band).
# GP/kernel draws scale ~cubically in length, so the fixed count pinned those
# priors into their worst corner; freeing the count is what makes them
# affordable inside max_generate_seconds. Inert for the live stream_cpu feed
# (which already stops at the training token budget). Not in contract_digest — no [generator]
# key is — so this is an operational (trainer-side) knob, no coordinated
# restart. 0 = legacy exactly-corpus_n_series drain.
corpus_target_points = 67_108_864
max_generate_seconds = 7200      # batch-drain budget: RLIMIT_CPU + wall for a materialised
                                 # (cache_reuse / verify) generator run. 1800 → 7200
                                 # (DEC-CA-0031): at 1800 every measured GP-prior was 13–116×
                                 # over budget; 7200 admits the gp prior at L=4096 with the
                                 # relative-jitter Cholesky (docs/MINER.md) and the cheaper
                                 # priors at reduced length under corpus_target_points.
                                 # RLIMIT_CPU sums across threads (multiprocessing is a
                                 # blocked import), so multi-core BLAS burns it faster —
                                 # single-thread your linear algebra.
# Streaming per-frame stall window (seconds between series before the child is
# killed). Split out of max_generate_seconds (DEC-CA-0031) so the batch-budget
# raise above does NOT widen how long a stalled generator can idle a heat/final
# lane — 1800 preserves the pre-split streaming behaviour exactly. 0 = fall
# back to max_generate_seconds.
stream_stall_seconds = 1800
max_memory_mb        = 4096      # rlimit for the generation sandbox
max_repo_mb          = 128       # cap on the fetched submission (code-only, no weights)
# Per-series variates (DEC-CA-0041). 32 = Toto 2 training-width parity (owner
# 2026-09-09). Measured: C=32 fits a 24 GB card at production shape (19.5 GB,
# linear in C) and costs no per-token throughput. Eval-side mv_channels stays
# ≤ 8 (EVAL_POOL.md); OOM is a challenger fault and never re-queues.
max_channels         = 32
min_channels         = 8         # v2 synthetic submissions: 8–32 channels per yield
# The record carrier (DEC-CA-0020). interface_version 1 = record-or-array yield
# with `values` only; every reserved field (mask, start, freq, group_id, roles,
# labels, quantiles) is hard-rejected until the release that consumes it. Bumps
# only when a field is accepted+consumed together (the accepted set then folds
# into [training] — one deliberate contract_digest bump).
interface_version    = 1
# Carrier cap in canonical payload BYTES — the denomination that stays correct
# when non-values fields arrive. Originally 16e9 = max_total_points × 8
# (float64), calibrated to the MATERIALISED DRAIN and "numerically inert" by
# design. v0.6.0 (d4141d8) armed it on the cumulative live STREAM, where a
# full-budget run legitimately serves token_budget × 8 bytes (finals: 40B
# tokens ≈ 320 GB) — every r33 run silently stopped at ~2.0B tokens (~5-15%
# of budget; OPSLOG 2026-08-21). HOTFIX: raised above the largest stream
# budget so the consumer's token-budget stop binds again (pre-v0.6.0
# semantics); drains stay memory-guarded by max_total_points. Restore a
# stream-shaped cap (per-corpus, cycling-aware) in v0.6.1. 0 disables.
max_payload_bytes    = 400_000_000_000
# Per-series cap on the masked fraction, active only once "mask" is accepted
# via [training] accepted_fields (DEC-CA-0023).
max_missing_frac     = 0.5
# Channel-redundancy gate (DEC-CA-0026): "off" | "shadow" | "enforce" against
# max_channel_corr (max off-diagonal |Pearson| between standardized channels).
# 0.999 targets ONLY the jitter-duplicate exploit. Keep off until the Stage 1
# shadow telemetry (channel_telemetry.frac_over_0999) clears honest
# generators; then shadow; enforce last. Meaningless at max_channels = 1.
channel_corr_mode    = "shadow"  # armed with the C=32 raise: labels only, drops
                                 # nothing; enforce waits on the shadow telemetry
max_channel_corr     = 0.999
# Structural data-quality gates (enforced by the trainer and `cascade verify`).
max_abs_value        = 0.0       # reject series whose peak |value| exceeds this; 0.0 = float32 ceiling
reject_constant      = false     # reject flat (zero-range) series
max_dup_fraction     = 0.05      # cache_reuse only: max fraction of exact byte-duplicate series; 1.0 disables
# Generation sandbox (trainer-side; never folded into contract_digest).
#   subprocess — rlimited child in a network namespace with a socket guard (default)
#   container  — same child inside docker/podman with hardened flags; requires a
#                digest-pinned sandbox_image and its sandbox_python
sandbox_mode   = "subprocess"
sandbox_image  = ""              # e.g. "ghcr.io/tensorlink-ai/cascade-worker@sha256:<64hex>"
sandbox_python = "python3"       # python inside sandbox_image
sandbox_strict = true            # no netns => refuse, don't degrade.
                                 # The payer / worker pods read THIS table (the pushed
                                 # chain.deployed.toml): a pod without unprivileged netns
                                 # refuses every leg. That refusal is an infra fault (worker
                                 # rc 1, tier "infra"), never a miner rejection; qualify the
                                 # pod images' netns before relying on them (testnet runs
                                 # strict since 2026-09-28). The orchestrator / validators run
                                 # NO generator code today. Two guards keep it that way
                                 # (cascade.shared.sandbox_policy). The LOAD
                                 # check refuses dedup_probe_series > 0 (retired, read by
                                 # nothing) unless strict / container. At RUNTIME, a process
                                 # holding the trainer wallet / private pool (trainer main,
                                 # validator main) refuses generator code in-process always,
                                 # and in a sandbox child unless strict / container.

[training]
# The FIXED training contract — identical for king and challenger; folded into
# contract_digest. Trains a Toto2 backbone from random init on each corpus.
# Arch integers verified against Datadog/Toto-2.0-4m config.json (2026-07-02).
base_arch          = "toto2"
arch_preset        = "toto2-4m"
base_arch_digest   = "953e40d292e037ea07ffea25ae1fdf2e8b7dc8990276c081fa67fb4371396147"  # sha256 of frozen arch+init; recompute with `cascade-trainer --offline`
# architecture (head_dim fixed at 64 across the Toto2 family; patch_size 32)
d_model            = 256
num_layers         = 4
num_heads          = 4
head_dim           = 64
patch_size         = 32
mlp_expansion      = 2
d_ff               = 688         # exact FFN hidden width from the released config.json
num_quantiles      = 9           # 9-level pinball head (0.1..0.9) — matches [eval]/scoring
# objective / masking (Toto 2.0 Contiguous Patch Masking + quantile head)
masking            = "contiguous_patch"
cpm_c_max          = 16
cpm_p_max          = 0.4
input_transform    = "arcsinh_causal"
# I/O lengths — must match [eval] so the trained model fits the eval windows
context_length     = 4096
horizon            = 64
# From-scratch budget, enforced as a fixed token count (hours × ref throughput)
# so king and challenger see identical compute; max_train_seconds is the hard guard.
# DEC-CA-0042 (owner 2026-09-16, amended 21:30 the same day): the BUDGET stays the
# 3h figure (3h × ref_throughput = 40B series-points — the univariate budget never
# grows); only the WALL grew to 5h (max_train_seconds below). The budget is
# series-points, so a C-channel corpus trains C× 40B channel tokens in the SAME
# step count as a univariate leg — width buys tokens, hours stay fixed.
target_train_hours          = 3.0
ref_throughput_tokens_per_s = 3700000  # 20x (2026-07-15): L40S is ~20x the old 185k ref, so it was
                                        # finishing the budget early; 20x the TOKEN budget, same wall
warmup_fraction             = 0.05
batch_size                  = 64       # Toto 2.0 global batch size
# Batch geometry at C > 1 (DEC-CA-0042, owner 2026-09-16; revises the
# DEC-CA-0041 "sequences" fill armed 2026-09-09): batch_size counts SERIES
# whatever the width — a C=32 batch is 64 series × 32 variates (Toto 2's own
# geometry). The step-count collapse "sequences" existed to prevent (a C=32
# leg falling from ~152k to ~4.8k updates on a channel-token budget) is
# closed by budget_denomination below instead: the budget is series-points,
# so every width earns the same step count and a wide batch trains C× the
# tokens per step. The wall (max_train_seconds) still binds first for a
# width the pinned SKU cannot push through in the leg — deadline_hit as ever.
batch_denomination          = "series"
# What one budget point IS at C > 1 (DEC-CA-0042, digest-bound drop-when-
# default; "points" = legacy C×L billing). "series_points": a (C, L) series
# costs L, so the channel-token budget scales with width — univariate 1×,
# C=32 → 32× — and the stream, the trainer's counter, and cascade-audit all
# stop on this rule (the corpus digest covers the consumed prefix). Needs a
# worker image built from this release: an older worker parses no such key
# and would bill C×L, stopping a wide leg C× early. Bit-identical at C=1.
budget_denomination         = "series_points"
# optimiser (u-muP transfer: tune once on a small proxy width, pin the result)
optimizer          = "normuon_adamw"
base_lr            = 4e-3        # u-muP width-independent learning rate
weight_decay       = 2e-8        # ARMED 2026-08-27: part of the DEC-CA-0035 cut
                                  # (see the armed block below; was 0.05)
lr_schedule        = "wsd"       # warmup-stable-decay (DEC-CA-0018): warmup only at
                                  # generation start; warm-started rounds re-enter FLAT at base_lr.
                                  # Finished form is a separate armable mechanism (fork-anneal or
                                  # ema_decay — arm at most ONE). wsd writes optimizer.safetensors
                                  # (~3x) so Muon/AdamW moments survive the round boundary.
                                  # [training] edit ⇒ contract_digest changed: restart trainer AND
                                  # validator together.
# anneal_fraction  = 0.15         # fork-anneal (DEC-CA-0029, wsd's deferred "D"): cosine decay
                                  # base_lr->0 over this fraction; annealed weights scored,
                                  # weights_stable rides beside for warm-start. OFF (0.0) = today's
                                  # artifacts, digest untouched. Arming is a contract cut (testnet
                                  # cycle + coordinated release). NEVER with ema_decay or
                                  # [telemetry] bench_anneal_fraction — one finished form only.
# Toto2-aligned optimizer constants (DEC-CA-0035, digest-bound drop-when-default;
# defaults = previously hardcoded behavior). ARMED 2026-08-27 (owner), one cut
# with ema_decay 0.999 (the artifact the measurement scored) + weight_decay 2e-8.
# NEVER with anneal_fraction / bench_anneal_fraction (trainer refuses).
ema_decay       = 0.999         # EMA finished form (DEC-CA-0033; the scored artifact)
gen_seed_mix    = 3             # DEC-CA-0033 N-seed generation mix (owner-armed
                                # 2026-08-27: measured working at 3 seeds) — corpus
                                # digest = rolling digest of the interleaved stream
                                # (~1/3 budget per derived seed, ~sqrt(3) less
                                # generation-seed noise)
muon_momentum   = 0.96          # Muon Nesterov momentum (default 0.95)
muon_row_beta2  = 0.999         # NorMuon row second-moment EMA (default 0.95)
grad_clip       = 7.0           # train-loop grad-norm clip (default 1.0)
adamw_beta1     = 0.91          # AdamW group betas (defaults 0.9/0.999)
adamw_beta2     = 0.972
adamw_lr_scale  = 0.018518518518518517   # 1/54 matrix:AdamW split (default 1.0)
warm_lr_scale   = 0.125         # warm-started runs train at base_lr x this;
                                # from-scratch keeps full base_lr (default 1.0)
umup_base_d_model  = 256         # proxy width the HPs were tuned at
train_seed_salt    = 1337        # mixed into the (shared) training seed
max_train_seconds  = 18000       # hard wall-clock cap (5h, DEC-CA-0042); a time stop is flagged deadline_hit
# Corpus feed mode (folded into contract_digest):
#   stream_cpu  — live-stream from a CPU generator; byte-exact reproducible
#   stream_gpu  — live-stream from a GPU generator; tolerance/same-hardware audit
#   cache_reuse — draw a fixed corpus once, multi-pass under the budget; byte-exact
corpus_mode = "stream_cpu"
# Accepted record-field set (DEC-CA-0020 layer 3): the payload fields the
# carrier accepts AND the trainer consumes — accept-equals-consume is enforced
# in code (only fields with a wired consumer load). DIGEST-BOUND via the
# drop-when-default convention: [] is omitted from contract_digest (today's
# digest is untouched), setting it is a deliberate bump → coordinated
# epoch-boundary restart, the routine re-pin protocol. Arming order per the
# roadmap: "mask" needs the pool's masked-history eval slice first; "roles"
# values 0/1 may arm with multivariate, allow_future_known (roles=2) stays
# false until docs/EVAL_POOL.md carries the covariate exogeneity rule.
accepted_fields    = []
allow_future_known = false
# Owner-published shared real corpus (DEC-CA-0028): immutable ref
# ("repo@sha256:<64hex>") of the frozen, licensed real-data corpus generators
# may READ (opt-in real_corpus_dir constructor kwarg; repos stay code-only).
# DIGEST-BOUND via drop-when-default: "" is omitted from contract_digest, so
# today's digest is untouched; setting it is the deliberate bump. Arming is
# FORBIDDEN until docs/EVAL_POOL.md carries the corpus/eval-pool disjointness
# rule (provenance + time wall) and the DEC-CA-0028 pricing experiment has run.
real_corpus_ref    = ""
# Pin the GPU SKU (exact torch device name). Empty = king and challenger must
# match each other. Unpinned 2026-09-02 for per-round GPU choice
# ([round] funded_pod_skus); folds into contract_digest — coordinated deploy.
expected_gpu = ""                # was "NVIDIA L40S" (DEC-CA-0002)
# Training-runtime image (digest-pinned worker ref), injected as
# CASCADE_TRAIN_IMAGE_DIGEST into each pod; final runs refuse a mismatched
# runtime. Baked chain.toml inside the image carries an EMPTY pin (enforcement is
# launch-env injection + the provisioner health gate; digest computed
# orchestrator-side). Folded into contract_digest — re-pin ⇒ trainer AND
# validators restart together at an epoch boundary, pods pull the new image.
train_image_digest = "sha256:43c07d4207d7693517d74203f6783fdd2c2f91e3d475f38db38e4798ae97785e"
# ^ ghcr cascade-worker:worker-v0.9.0 — built 2026-09-16 09:38 UTC from this
#   branch (publish-worker run 35080201768): budget_denomination (DEC-CA-0042)
#   parsed on the pod, PLUS check_loss_finite (840e900, 2026-09-14) which the
#   v0.8.0 image (main@9346a52) never carried — three NaN legs trained to the
#   wall on it. Re-pinned here (declared gating: no validator restart).
# Extra final-stage model sizes. Each [[training.sizes]] is trained alongside
# the primary in the final; the throne is decided on the COMBINED score. A size
# overrides only shape fields + digest + throughput; all else inherits [training].
#
# 20M (Toto2-22M) is DISABLED at launch. Before enabling: pin the arch to the
# released Datadog/Toto-2.0-22m config.json, measure throughput, and recompute
# base_arch_digest with `cascade-trainer --offline`.
# [[training.sizes]]
# arch_preset                 = "toto2-22m"
# base_arch_digest            = "c7ecca53ed939eabfc34ccdb8a698d69101526c24f299efa21c0c0c288c96792"
# d_model                     = 512
# num_layers                  = 8
# num_heads                   = 8       # head_dim stays 64 ⇒ d_model = num_heads × 64
# mlp_expansion               = 2
# ref_throughput_tokens_per_s = 90000   # MEASURE on the reference GPU for THIS size
# Size-conditional overrides (DEC-CA-0027; unset = inherit [training]):
# expected_gpu       = ""     # per-size duel GPU pin (exact nvidia-smi string;
#                             # 300M+ pins H100-class — mind SXM vs PCIe variants,
#                             # and measure ref throughput on THAT variant)
# target_train_hours = 0.0    # per-size budget hours (313M increments ~6h; set
#                             # jointly with the margin re-unitisation from the
#                             # null-LCB noise-floor measurement)

[round]

# Trainer-only resilience: owner fairness and correlated GPU outages.
ops_max_active_per_coldkey = 1
ops_gpu_failure_threshold = 2
ops_gpu_failure_window_seconds = 3600
ops_gpu_cooldown_seconds = 10800
# The settlement grid. CONSENSUS-RELEVANT: every validator derives the epoch
# from this for pool-snapshot selection, so it must move in LOCKSTEP across
# operators (a validator on a stale value silently picks a different snapshot).
# NOT part of contract_digest ([training] only). The DEC-CA-0045 rollover
# switches it to [activation] epoch_blocks_after.
epoch_blocks     = 3600   # ≈12h at a 12s block time
round_hours      = 12.0   # informational: wall-clock span of an epoch
# Scheduled switch (0/0 = steady state). Last used: 7200 → 3600 at 8726400,
# 2026-07-29. To schedule another, the block must be a boundary of BOTH grids
# (load-checked); set both back to 0 once it is safely past.
epoch_blocks_prev      = 0
epoch_activation_block = 0
# Rolling intake + era king (DEC-CA-0043, block-gated). Trainer POLICY: from
# this block challengers train the moment they are funded, legs cross
# boundaries, every boundary publishes ONE settlement manifest (era king +
# every challenger finished since the last settlement), the king's leg is
# trained once per era and cached. The trainer idles until the rollover.
# ROLLOVER recipe (owner call, one boundary for
# everything): rolling_from_block = era_king_from_block =
# tenure_blocks_from_block = cohort_maxt_increment_from_block = ROLLOVER
# (a multiple of epoch_blocks × era_settlements — the era grid is absolute);
# epoch_blocks = 900, epoch_blocks_prev = 3600, epoch_activation_block =
# ROLLOVER (3h grid); ROLLOVER % 3600 == 0. Load-checked. Do NOT arm before
# the six external validators run a release carrying the era envelope.
# With every key at 0 the block is DECIDED ON CHAIN by validator stake
# ([activation] below, DEC-CA-0045); typing a block here overrides that.
rolling_from_block = 0
# Settlements per era (consecutive boundaries sharing one set of training
# seeds, one init and one cached king checkpoint): 4 on the 3h grid = 12h
# eras — today's king-leg cadence with 3h verdicts inside it.
era_settlements = 4
# `cascade score` emulation budget/windows (miner-side) and the wall-clock
# guard of a reduced-budget leg (bench-anneal): max(factor × hours, floor).
heat_train_hours = 1.0
heat_n_windows   = 2000
heat_guard_factor        = 1.0
heat_guard_floor_seconds = 900
# Default rolling admission cap when funded_field_cap = 0 (max of the two).
finalists        = 1
max_finalists      = 3
# Retired with the boundary-round trainer — ignored by the loader
# (cascade.shared.config.RETIRED_KEYS); values kept for older releases.
heat_num_samples = 100
heat_infra_requeues      = 2
init_gate_mode     = "shadow"
tie_runoff_windows = 0
tie_runoff_phase_seconds = 900
# Original v1 reveal floor (0 = off), preserved for historical replay.
# The v2 entry opening is separately resolved under [v2] below; do not replace
# this historical block with an estimated future launch block.
commit_floor_block = 8622922  # original v1 floor; v2 has its own opening below in [v2]
                              # (unit fixtures neutralize it in tests/conftest.py)
one_submission_per_hotkey = true
duel_from_block = 8992800   # retired (ignored)
duel_field_cap  = 0         # retired (ignored)
duel_seat_all   = true      # retired (ignored)
# ── Miner-funded compute (DEC-CA-0036) ───────────────────────────────────────
# "required": the funded queue IS the intake — every funded, revealed entry
# trains, up to funded_field_cap legs in flight. Details:
# docs/OPERATOR.md.
funded_mode = "required"
funded_activation_block = 9046800   # retired (ignored)
funded_queue_path = "funded_queue.json"   # shared with cascade-intake (work_root-relative)
skip_unfunded_rounds = true               # retired (ignored)
max_rounds_per_day = 2                    # retired (ignored)
funded_entry_ttl_hours = 36.0             # MUST track cascade-intake --ttl-hours (key TTL)
# "rent": each funded leg rents ONE pod on its payer's Lium key (the era king
# stays operator-funded). Consensus-inert.
funded_pods = "rent"
payer_vault_dir = "payer_vault" # cascade-intake --vault-dir (work_root-relative)
funded_pod_sku = ""             # unused with funded_pod_skus set (per-round pick)
# Worker image funded pods boot — keep = the fleet's pinned digest.
funded_pod_image = "ghcr.io/tensorlink-ai/cascade-worker:worker-v0.9.0@sha256:43c07d4207d7693517d74203f6783fdd2c2f91e3d475f38db38e4798ae97785e"
# sha256 of that image's cascade/**/*.py (scripts/worker_code_fingerprint.py
# <repo>@<digest>). Every rented final/funded pod must hash its files to this
# BEFORE a leg is dispatched — the digest env a template injects is echoed
# faithfully by a host that started a STALE image under the pinned tag
# (2026-09-12: Lium 91.224.44.222/.223 ran worker-v0.7.0 as "v0.8.0"; three
# miners' legs stalled and were burned). Re-derive on every image re-pin.
worker_code_fingerprint = "dd5236181d9267f5bae26d49e545cf6bfb06afc2d0618e7e25cf101034db763b"   # 100 files, worker-v0.9.0 (43c07d42…); registry walk == branch tree 2026-09-16
funded_ready_timeout_seconds = 900.0
# How a funded leg's checkpoint leaves its payer pod. "harvest" (default):
# CREDENTIAL-FREE pods — the worker trains --local-only (nothing at all in the
# pod's env), the orchestrator pulls the checkpoint over the pinned ssh,
# ingest-verifies it, and uploads it under its own identity. Needs a
# funded_pod_image built from a --local-only-aware release. "robot": legacy
# per-pod push-only Hub robot (revoked at teardown; Harbor expiry below).
funded_pod_checkpoint = "harvest"
funded_robot_duration_days = 1
# Shared miner-funded A/B/C admission cap (0 = finalist_cap); king work
# has reserved admission. Waiting jobs queue before compute starts. Also
# caps lane-A in-flight entries. Overlay-settable; CPU VMs have their own cap.
funded_field_cap = 99
funded_capacity_probe = true    # retired (ignored)
funded_capacity_reserve = 1     # retired (ignored)
# Allowed GPU types, preference-ordered; each round runs entirely on the
# most-available one (king included). Needs [training] expected_gpu = "".
# Blackwell (RTX5090, B200/B300) waits on a torch cu12.8 re-pin.
funded_pod_skus = ["RTX4090", "RTX3090", "L40S", "L40", "A6000"]
# Never rent executors whose CPU model contains any of these (case-insensitive
# substring of Lium's specs.cpu.model). 2026-09-13/14: four legs stalled —
# zero series inside the 1800 s stall window — and all four sat on Xeon
# E5-26xx v4 hosts, while the same generators ran on every Ryzen host.
# Applies to the king rent, every payer leg and the capacity probe. [] = off.
funded_cpu_blocklist = ["Xeon(R) CPU E5-2"]
# Per-SKU floor for the fixed calibration bench every freshly rented pod runs
# over ssh before dispatch (~5 s; host_probe.host_bench composite tokens/s, the
# same number the run telemetry reports as host_bench_tokens_per_s). Below the
# floor the pod is released, its executor stays excluded for the round and the
# leg rents again on the stale-image bad-pod budget — the miner is never
# blamed; the JIT king gets the same gate on a fresh rent. 2026-09-15 round
# 9068400: the 4090 fleet benched 394M–646M (median ~587M) on one equal wall —
# the king's 394M host trained 70 % of its budget, 5900X hosts 100 %. An
# unreachable probe logs and lets the pod through. {} / unknown SKU = off.
# ARMED 2026-09-16 (owner: "add the guard for 4090") RTX4090 = 500M tokens/s:
# 45 Lium 4090 legs Sep 13–16 (wandb) — hosts >= 570M trained 0.76–1.00 of the
# budget, 489–516M hosts 0.54–0.84, 376–453M hosts 0.46–0.81; the floor drops
# the bottom ~27 % of 4090 rentals and keeps every seated leg on an
# equal-compute host. Other SKUs stay unguarded until benched.
funded_host_bench_floor = { RTX4090 = 500e6 }
# ── Open-market rounds (owner 2026-09-20; ON by default) ─────────────────────
# funded_sku_per_leg: choose the GPU type PER LEG — every leg (the JIT king
# too) rents the cheapest fitting executor across funded_pod_skus instead of
# the whole round locking to one type. Fair because budgets are compute-
# denominated and every leg completes its full token budget; needs
# [training] expected_gpu = "" and the validators' manifest gate (_check_gpu,
# gpu_mismatch on mixed types) lifted — that gate lifts at [scoring]
# era_king_from_block (= ROLLOVER), and the per-leg choice takes effect at
# the SAME block: until then every round still locks one type (#295), so
# arming this key early changes nothing before the rollover.
funded_sku_per_leg = true
