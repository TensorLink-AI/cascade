# "stay off"): cascade-intake opens for private submissions + lium-key funding
# right AFTER the 08:30 morning round (9043200); the first funded round to
# consume them is the evening 9046800. Policy "dethrone" = maximum privacy — the LIVE king's code stays
# private for its whole reign and publishes only at hand-off, so history stays
# re-derivable while a reigning edge is never exposed. Flip to "delay" (+N
# reign rounds) or "crown" (immediate) before Friday if less privacy is wanted.
submission_vault_dir = "submission_vault" # work_root-relative operator-private store
champion_publish = "crown"   # a new king's code goes public as soon as it is crowned (owner 2026-09-14: "we want it immediately available")
