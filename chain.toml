cascade_enabled      = true      # ARMED 2026-08-05: warm-start promotion + completion bench live
# Consecutive undethroned ROUNDS before a Cascade fires — "survived N
# challenges". Renamed from cascade_reign_days on 2026-07-28 (the old key is
# still accepted): the clock used to divide reign blocks by a fixed 7200-block
# day, which at the 24h cadence happened to equal one round. At 12h rounds that
# same 7 would have silently meant 14 challenges. The clock is now epoch-
# relative (cascade.validator.cascade.reign_rounds), so this number means the
# same thing at any cadence and needs no re-tuning when the round length moves.
# Lowered 7 → 5 at arming (owner, 2026-08-05): at the 12h cadence, 5 rounds
# ≈ 2.5 days per promotion cycle. CONSENSUS-relevant — every validator must
# run the same value or cascades fire at different rounds (divergent pins).
cascade_reign_rounds = 5
# Promotion ENVELOPE (DEC-CA-0013). CONSENSUS-relevant like the reign clock:
# every validator must run the same values or their accept/reject verdicts on
# a declared promotion fork. cascade_top_k caps how many member checkpoints
# one promotion may declare (the trainer may declare fewer — the selection
# policy is trainer-side and free to evolve); cascade_quality_epsilon is the
# quality floor: every member's bench geomean must sit within (1 + epsilon)
# of the best verifiable score in the reign, so diversity can never be bought
# with a materially worse init.
cascade_top_k          = 3
cascade_quality_epsilon = 0.05
# Block-gated contract transition (2026-08-20, WSD flip — DEC-CA-0018): rounds
# whose epoch boundary precedes contract_from_block score against the pinned
# PRIOR contract digest (the warmup_cosine contract every round through
# boundary 8892000 trained under), so validators restart onto this release at
# any time without sacrificing the in-flight round; rounds from block 8895600
# (2026-08-21 08:30 UTC) accept only the digest recomputed from [training]
# above. Same activation block as mix_from_block — one flip boundary for the
# whole release. Fleet-consensus values: keep identical across validators.
# Retire (""/0) in the release after the transition round ages out.
# ARMED 2026-09-10 (owner): this release's [training] cut (expected_gpu ""→
# unpinned, train_image_digest → worker-v0.8.0 sha256:9d5bc70d…,
# batch_denomination = "sequences") takes effect for rounds from block 9046800
# (Fri 2026-09-11 20:30 UTC — the evening funded round; one flip with
# funded/max-T/increment). Every earlier round — INCLUDING the 08:30 morning
# round at 9043200 — verifies against the pinned PRIOR digest below: the exact
# contract_digest the LIVE mainnet manifests carry right now (read off
# manifests/latest.json 2026-09-10), so the morning round runs on the OLD
# trainer/contract and validators restart onto this release ANY TIME before
# 9046800 without sacrificing an in-flight round. New digest recomputed from
# [training] above = 22081e46…; verify after any edit.
# (Retires the aged-out c6d24621…/8942400 DEC-CA-0035+0033 transition pair.)
# 2026-09-16 (DEC-CA-0042, amended): max_train_seconds 18000 (target_train_hours
# stays 3.0) / batch_denomination "series" / budget_denomination "series_points"
# move the digest again (recomputed = f88909e9…). None of them is a LOCKED term, and
# declared_contract_from_block (8942400) is armed below, so this cut ships on
# the trainer + worker image alone — validators keep accepting the declared
# body; the strict path (and this prior pin) only matters for a body-less
# manifest, which the trainer no longer publishes.
prior_contract_digest  = "81d28346acb55892290ef3a6970caed2c3e8a5f569627b76cdefc29426f6f045"
contract_from_block    = 9046800
# Declared-contract gating (DEC-CA-0036). From this block a manifest is gated on
# the LOCKED terms only — arch_preset, base_arch_digest, expected_gpu,
# train_seed_salt, and each extra size's preset/GPU pin — verified against the
# full training contract the trainer now publishes and signs inside the manifest
# (`contract_body`). Every other [training] term is recorded and audited but
# never rejects a round, so a trainer-side fix (runtime image re-pin, recipe
# change, budget change) ships the same day instead of waiting on six external
# validators to restart.
#
# 0 = OFF (the value before the 2026-08-27 arming): every round takes the legacy strict path (full
# digest equality against the local [training]). Arming this is the LAST
# [training]-driven change that needs a coordinated fleet deploy — after it,
# [training] edits never again reject a round on an un-upgraded validator, and
# validator restarts are reserved for actual scoring-rule changes ([scoring],
# [eval], the cascade envelope). Ship the release first, let the fleet upgrade at
# its own pace, THEN set the block: rounds before it replay strict, rounds after
# replay declared, and cascade-audit judges each round under its own rule.
# Fleet-consensus value like every [scoring] key: keep identical across validators.
# ARMED 2026-08-27 (owner): live for rounds from r47's epoch, same boundary as
# the recipe cut — one validator update before block 8942400 covers both.
declared_contract_from_block = 8942400
# Init-baseline duel gate (DEC-CA-0034) in SHADOW (armed 2026-08-27, owner):
# the validator scores the warm-start init on the verdict windows and records
# init_baseline_geomean / init_floor_passed in the receipt (drop-when-None —
# archived signatures survive) but the verdict is UNCHANGED. Log-only, so
# validators may enable it at their own pace; enforce is a later, separate
# coordinated decision once the shadow verdicts calibrate init_gate_tolerance.
init_gate_mode = "shadow"

[dependencies]
# Allowlist for a generator's requirements.txt. Generators are purely
# algorithmic — no weight files accepted (see cascade.interface.validation);
# torch is allowed as a compute library for GP/kernel priors only.
max_packages = 16
allowed = [
    "numpy",
    "scipy",
    "pandas",
    "statsmodels",
    "numba",
    "torch",
    # GP/kernel/graph primitives for GP-prior generators (CPU-only generate path)
    "scikit-learn",
    "gpytorch",
    "networkx",
]

[static_guard]
# Blocked imports in a submitted generator.py.
blocked = [
    "socket",
    "urllib",
    "urllib2",
    "urllib3",
    "requests",
    "httpx",
    "http.client",
    "http.server",
    "subprocess",
    "os.system",
    "ctypes",
    "cffi",
    "pickle",
    "marshal",
    "shelve",
    "multiprocessing",
    "asyncio.subprocess",
    "cascade.trainer",
    "cascade.validator",
    "cascade.shared.chain",
]

[storage]
# Hippius storage layer: Hub OCI registry for models/checkpoints/generators
# (pinned by repo@digest), S3 for manifests + logs. Credentials come from the
# environment, never this file: HIPPIUS_HUB_TOKEN (or _USERNAME/_PASSWORD) for
# the registry, HIPPIUS_S3_ACCESS_KEY / HIPPIUS_S3_SECRET_KEY for S3.
hub_registry_url = "https://registry.hippius.com"   # informational; client uses its own default
hub_namespace    = "cascade"                        # repo namespace for trainer/owner pushes
s3_endpoint      = "https://s3.hippius.com"
s3_region        = "decentralized"
manifest_bucket  = "cascade-manifests"              # round-<id>.json + latest.json
logs_bucket      = "cascade-logs"                   # logs/round-<id>/<role>.jsonl
# Eval-pool bucket (daily snapshots + pool/index.json, published with
# `cascade-pool publish`). Empty = use the static [eval] window_pool ref instead.
pool_bucket      = "cascade-eval-pool"              # daily snapshots from publish-pool.yml
# Pool endpoint override (e.g. Cloudflare R2 + POOL_S3_ACCESS_KEY /
# POOL_S3_SECRET_KEY); empty = reuse the Hippius S3 endpoint above.
pool_s3_endpoint = ""
pool_s3_region   = ""
# HuggingFace-Hub dataset used as a manifest/receipt fallback ONLY during a
# Hippius S3 outage (cascade.shared.hippius.HFFallbackStore). Make it a public
# dataset; auth via HF_TOKEN. Empty = no fallback.
hf_backup_repo   = ""                               # e.g. "yourorg/cascade-manifests-mirror"
# S3-compatible BACKUP of the manifest/receipt bucket: dual-writes every object
# and serves reads when Hippius S3 is down. Credentials via
# BACKUP_S3_ACCESS_KEY / BACKUP_S3_SECRET_KEY.
backup_s3_endpoint = "https://04128c0d5ba104eb6a6b77c898aed78e.r2.cloudflarestorage.com"
backup_s3_region   = ""                             # empty = "auto" (R2's region)
backup_bucket      = ""                             # empty = reuse manifest_bucket name
# Live R2 BACKUP of the eval-pool bucket: dual-writes every snapshot tar +
# pool/index.json and serves validator reads when Hippius S3 5xx's, so an outage
# no longer strands the pool-pin gate (pool_pin_unverifiable). Endpoint/region/
# creds are REUSED from backup_s3_* above (BACKUP_S3_ACCESS_KEY/_SECRET_KEY);
# only the bucket differs. Empty = no pool backup. Hippius stays primary.
pool_backup_bucket = "cascade-eval-pool"            # R2 bucket; "" disables
# Private KING ARCHIVE (Cloudflare R2): `cascade-scrape-kings` saves every
# generator that has ever held the throne (the code, fetched from the Hub and
# packed to a tar) under kings/ plus a kings/index.json "db" — and EVERY
# eligible participant generator (from each round's full receipt) under
# generators/<hotkey>/ (grouped by committing miner) with its own
# generators/index.json. A permanent private record,
# independent of the public Hub repos a miner could delete. Endpoint/region
# default to the backup_* R2 above; credentials via KING_ARCHIVE_S3_ACCESS_KEY
# / KING_ARCHIVE_S3_SECRET_KEY (falling back to BACKUP_S3_* when unset). Keep
# the bucket PRIVATE.
king_archive_bucket      = "cascade-king-archive"
king_archive_s3_endpoint = ""                       # empty = reuse backup_s3_endpoint
king_archive_s3_region   = ""                       # empty = reuse backup_s3_region ("auto")

[manifest]
# Signed training receipts in [storage] manifest_bucket. trainer_hotkey is the
# only signer a validator trusts.
trainer_hotkey  = "5FcCsoB2R5M55RdrNrvPQv7xmLJRFzs7R7C73UUSxgUCyfsw"  # owner trainer hotkey (mainnet)
poll_seconds    = 120
# Trust anchor for the public round receipts: the validator hotkey whose
# signature `cascade-audit` requires. Empty = verify against the receipt's
# self-declared signer (audit warns that the signer is unpinned).
validator_hotkey = "5FcCsoB2R5M55RdrNrvPQv7xmLJRFzs7R7C73UUSxgUCyfsw"  # main validator receipt signer

# The trainer stamps prev_manifest_sha256 (the manifest hash link) on
# settlements at/after this boundary. Signed-body field: set it only after
# every validator runs a release that knows it. 0 = never stamped.
hash_link_from_block = 0

[validator]
weight_set_interval_blocks = 180
poll_seconds               = 120
hf_cache_seconds           = 1800  # retired (RETIRED_KEYS): older releases require it
state_db_path              = "validator_state.db"
# Cascade persistence (see [scoring] cascade_reign_rounds): reign clock + reign
# checkpoint log, and the promoted warm-start pointer. The CO-HOSTED TRAINER
# reads warm_start_init_path too (its rounds train from the pinned init once a
# promotion fires) — point both processes at the same file.
cascade_state_db_path      = "cascade_state.json"
warm_start_init_path       = "warm_start_init.json"
# Operator kill-switch (or `cascade-validator --force-burn`): burn to
# [scoring] burn_uid on EVERY weight-set instead of voting the champion, while
# still refreshing last_update (stays Yuma-active). Champion state is untouched
# and keeps evolving; unset + restart to resume voting the persisted king.
# For "something looks wrong, stop endorsing while I investigate".
# force_burn                 = false
# First boot with no local state: inherit the current champion from the signed
# public receipt trail (verified against the pinned [manifest] hotkey) instead
# of judging the next manifest blind. Makes validator join-order irrelevant to
# who holds the throne. Existing state always wins; flip false to opt out.
bootstrap_from_receipts    = true

[wandb]
# Optional live training dashboards (Weights & Biases). Observability only —
# never feeds scoring or weights; held-out eval scores are not sent. One run per
# (round, competitor, size), tagged with the miner hotkey. Requires the [wandb]
# extra; WANDB_API_KEY comes from the environment, never this file.
enabled = true                  # live wandb logging ON (owner 2026-07-18); observability only
project = "cascade"             # wandb project; make it PUBLIC for miners to view
entity  = ""                    # wandb team/user (empty = the API key's default)
mode    = "online"              # online | offline | disabled
# A SEPARATE, project-scoped wandb key for ISOLATED (miner-paid) pods, named by
# env var; forwarded to those pods as WANDB_API_KEY so funded legs stream live
# too. The payer can read it from their pod — never the operator's key (the name
# "WANDB_API_KEY" is refused). Empty ⇒ funded legs log no wandb (pre-2026-09-13).
funded_key_env = "WANDB_API_KEY_FUNDED"

[telemetry]
# Host-side run telemetry (cascade.trainer.host_probe). Observability only —
# these fields ride the training-log channel next to the per-step metrics, never
# the manifest, the receipt, or contract_digest, and nothing in the scoring path
# reads them. They exist because the wall prices generator speed (DEC-CA-0001) on
# a fleet rented per round: data_wait_frac can rule the CORPUS out as the cause of
# a slow run, but only a host-side measurement can rule the POD in. host_bench
# times a fixed calibration workload before each run's corpus stream opens (a few
# GPU-seconds; it cannot eat the compute budget — max_train_seconds anchors at the
# first training batch), and is the one field comparable across pods.
host_probe = true               # lane geometry, CPU/GPU capability, opaque pod + machine ids
host_bench = true               # + the fixed calibration bench (host_bench_tokens_per_s)
# Payer-pod bench (DEC-CA-0036): each funded challenger benches on its own pod
# after the duel (miner-billed, ~1h; the pod is torn down when the sweep ends).
# Payer numbers are a FILTER: the top-N re-bench on the operator's king pod and
# only the operator's numbers are signed/published; a payer number better than
# the re-bench by more than the tolerance is a forged sweep (entry dropped).
# Lane A under a validator [v2] bench_source (DEC-CA-0063): the trainer runs
# no challenger sweep and no payer verification — these keys then do nothing.
funded_bench = true
funded_bench_verify_top = 1
funded_bench_verify_tolerance = 0.02
# Retired (ignored): the scratch-shadow leg rode the boundary-round bench
# thread (DEC-CA-0014 Stage 1 needs a rolling port to come back).
scratch_shadow_every_rounds = 0
# bench_anneal_fraction = 0.15  # bench-anneal (DEC-CA-0030): NEVER together with [training]
                                # ema_decay (the worker's anneal_recipe refuses an EMA-armed
                                # contract) or anneal_fraction — one finished-form mechanism
                                # at a time. Before the post-round bench sweep,
                                # resume each duel checkpoint (weights + optimizer, fresh salted
                                # corpus) under a pure cosine decay base_lr -> 0 for this fraction
                                # of the full budget, and bench the ANNEALED copy — the signed
                                # BenchScores (public bench stream, promotion picks, DEC-CA-0017
                                # guard) then read finished form instead of wsd's mid-stable
                                # artifacts. Canonical checkpoints, manifest, bench-report wire
                                # format, and every validator-verified byte untouched — TRAINER
                                # RESTART ONLY, no validator involvement. Anneal-leg failure falls
                                # back to benching the raw checkpoint. Costs ~fraction x one
                                # training leg per benched checkpoint on the same pod; size
                                # [eval] bench_hold_max_hours accordingly. 0.0/absent = off.

[activation]
# Stake-weighted activation of the DEC-CA-0043 rollover (DEC-CA-0045). Each
# validator on a release carrying this feature posts a plain on-chain
# commitment ("cascade-ready:1:<feature>:0:0") from its hotkey at startup.
# At every boundary of the grid in force, every node sums the stake of the
# permit-holding validators that have posted it; the first boundary where
# that share reaches `threshold` LOCKS IN (one-way), and the rollover is the
# NEXT boundary — the round in which the count crossed finishes on the old
# rules, the one after starts on the new (rolling intake, era king, tenure
# in blocks, the grid switch below, and the increment-unit max-T all flip
# there). A validator that has locked in rewrites its note with the block,
# so a restarted or late node adopts the block validators holding
# `threshold` of stake all name — no archive node needed. The trainer and
# the provisioner READ the same decision every tick and arm themselves (a
# trainer still on the OLD release must be restarted on the new one at the
# lock-in boundary); the validator stamps the block on every receipt
# (`activation_block`) so the audit replays each round under it. The
# typed-in DEC-CA-0043 keys ([round] rolling_from_block etc.) always win
# over the resolved block — the owner override. "" = off.
feature = "rolling-era-king"
# Fraction of ELIGIBLE validator stake (permit holders) that must have
# signalled. A bare majority: check the owner validator's own share before
# relying on this — over half and it decides alone.
threshold = 0.51
# The grid from the rollover ([round] epoch_blocks after it; the loaded 3600
# becomes epoch_blocks_prev). Must divide epoch_blocks. 0 = keep the grid.
epoch_blocks_after = 900
# Leave OUT permit holders whose last weight-set is older than this many
# blocks at the tally, so a dead validator's stake cannot hold the number
# down. 0 = count every permit holder.
dormant_after_blocks = 0

[v2]
launch_at_utc = "2026-10-30T12:00:00Z"
commit_open_at_utc = "2026-10-30T09:00:00Z"  # V2 reveals queue here; training waits for v2
commit_from_block = 0  # resolved from finalized timestamps, or explicitly pinned by operator
prelaunch_burn_readiness = "r2"
# cascade v2 (DEC-CA-0050): Cascade-MOE-28M king lineage (lane A) + the
# domain-expert lane (lane B). Finalized chain timestamps resolve launch_at_utc
# to the first era boundary at or after the target. A positive typed from_block
# overrides the date and must be era-aligned. Validators must upgrade before
# launch; from_block = 0 stays inert until the date is resolved. From that era
# on: lane A trains [v2.training] from a NEW
# random-init lineage (toto2 members never initialise the MoE), the slow
# router bites once the routing gate opens, receipts stamp `v2_block`, and
# lane A keeps 100 % until another lane launches. Planned order: C first
# (A/C 75/25), then B (A/B/C 50/25/25); activation remains separate for each.
from_block = 0
# Rides the same go-live (DEC-CA-0054): every v2 settlement enforces the
# bench gate (the mode; the RULE is DEC-CA-0054's three suites + six-number
# geomean only until bench_gate_v2_from_block below, which on mainnet is the
# same block). "off" = keep [scoring]'s mode.
bench_gate_mode = "enforce"
# DEC-CA-0061 (rule v2, owner 2026-10-20): from this block the gate's rule is
# "avg_noninf_winrate" — four suites (FEV joins), per-task ratios, average
# < 1, no suite's ratio LCB above 1 + [scoring] bench_gate_tolerance at
# alpha/4, win rate >= [scoring] bench_gate_min_win_rate (replaces the
# six-number geomean). "v2" = the value of from_block, so the rule goes live
# with v2 and never re-judges a settled era; 0 = DEC-CA-0054.
bench_gate_v2_from_block = "v2"
# DEC-CA-0063 (owner 2026-10-19: "on main branch it scores on main eval first
# then only evals the benches if the competitor wins … our dedicated GPU for
# validation"). Overlay-settable (DEC-CA-0057): from this block
# the lane-A bench rows come from the MAIN validator ([netconfig]
# owner_hotkey), which sweeps GIFT-Eval/BOOM/TIME (+FEV under DEC-CA-0061) on
# its own GPU ONLY for a challenger that clears the private pool, plus the era
# king (cached per pointer) and, when the king check is due, the king + init.
# It signs bench_v/round-<id>.json (write-once). A validator needs it only
# when a clearer reaches the gate or the king check is due; it then HOLDS
# until a later trainer-signed manifest records the report's sha256 (or
# "absent" after bench_report_timeout_settlements — its clearers are infra,
# never a loss) and judges from exactly those bytes. The trainer runs no
# lane-A challenger / king sweep and no payer-pod verification for these
# eras (the once-per-seed-epoch init bench stays: it publishes the init
# pointer). "v2" = from_block, so it switches with the v2 go-live. Load-
# checked: needs king_ladder = true and [netconfig] owner_hotkey set once the
# resolved block is > 0. The main validator needs a GPU (--device cuda or
# --eval-hosts) and the benchmark data staged (cascade-benchmark-download).
bench_source = "validator"
bench_source_from_block = "v2"
# DEC-CA-0063 liveness bounds (overlay-settable): the trainer records a
# validator-sourced settlement's report "absent" in the Nth later settlement
# built without it (>= 1). bench_sweep_hours = ONE checkpoint's sweep
# allowance (its retry included): every clearer has its own, the king's sweep
# has its own (never a clearer's). bench_budget_hours = the settlement CAP over
# all of them: a clearer starts only while the cap still holds its whole
# allowance (+ the king's when the king is not swept yet); one that does not
# fit is published budget_deferred (never a loss) and the trainer carries its
# leg into the settlement that records the report (<= 2 carries, inside the
# era). 6.0 / 2.0 = a first clearer + the king, then one more clearer against
# the cached king. Sweep failures reproduced on both attempts with checkpoint
# evidence (non-finite forecasts, every config failing at scoring) are a
# checkpoint_fault (the clearer fails the gate); everything else is infra.
# Expected sweep time per checkpoint is an owner measurement item
# (docs/OPERATOR.md "Sizing the sweep"); bench_sweep_hours <= the cap.
bench_report_timeout_settlements = 8
bench_budget_hours = 6.0
bench_sweep_hours = 2.0
# DEC-CA-0055 launch economics (CONSENSUS; inert until from_block is typed,
# except the pre-launch burn, which is decided by an on-chain vote):
# every v2 era before v2_first_era + 14 (7 days) trains from random init, and
# the promotion reign clock counts from the window's end.
random_init_eras = 14
# King-check timing: the check is due at the first settlement whose warm start
# (min_effective_era) would land >= this many blocks into the reign (counted
# from no earlier than the window's end) — a pass takes effect 3 days into
# the reign (first at ~day 10); the era of notice is absorbed, not added.
reign_warm_start_blocks = 21600
# Pre-launch burn: from the boundary after 51 % of permit stake signals the
# DEC-CA-0045 note segment `prelaunch-95-r2`, every pre-v2 vector sends 95 %
# to burn_uid (miners keep their split of the rest); it ends at the first v2
# settlement. prelaunch_burn_from_block = <block> types it instead (override).
prelaunch_burn = 0.95
# The carried (toto2) king's court is paid at most 5 % of total emissions from
# the v2 block until a king is crowned at a v2 settlement (lane B unchanged).
carryover_king_share = 0.05
# The king check at every ripe reign point (pool increment-LCB vs the init +
# all six suite means vs the init), king-only (k = 1) promotions backed by a
# pass, the lane-A share ladder (new king at a margin-tiered start below,
# +10 % per pass to 95 %, a fail drops to 10 %; the last former king 5 % for
# 36000 blocks), and the 1 % slash for a king leg the operator had to fund.
king_ladder = true
# Margin-tiered start share (owner 2026-10-20, CONSENSUS, overlay-settable):
# a king crowned at an INCREMENT-unit settlement starts at the start_bp of the
# highest [lcb_threshold, start_bp] tier its crowning LCB (the family-wise
# corrected increment-unit LCB the dethrone bar below judged — never the point
# estimate) meets. Thresholds strictly descending in (0, 1); start_bp in
# [ladder_fail_bp, ladder_cap_bp], non-increasing down the list. The lowest
# threshold should equal win_margin_end (the bar's floor): below it no win can
# happen (a mismatch pays the lowest tier, logged). PLACEHOLDERS — calibrate on
# seed replicas of one recipe on the private pool (the 0.50 tier must be rare
# under noise). The dethrone bar itself is unchanged.
ladder_start_tiers = [[0.50, 8000], [0.25, 6500], [0.10, 5000], [0.01, 2500]]
# The fixed start for a crowning judged in LEVEL units (random-init eras, a
# level fallback without an init baseline) or with no duel LCB (a DEC-CA-0048
# successor): a level LCB is a different statistic, so the tiers never apply.
ladder_start_level_bp = 5000
# Escalating key slash (owner 2026-10-20, CONSENSUS, overlay-settable): the
# FIRST operator-paid king leg of a reign holds the 1 % slash for at least
# this many eras (6 = one 3-day round) from that settlement, even after a key
# rotation (then until a king-funded leg); a SECOND lapse in the same reign
# holds it for the rest of the reign. operator_fault never counts; a crowning
# resets the count. 0 = the first lapse lifts with the first king-funded leg.
key_slash_min_eras = 6
# Lane-A dethrone bar on v2 settlements (owner 2026-10-19: "increment margin
# to clear go from 10% to 1%") — CONSENSUS. A fresh king's increment-unit LCB
# bar is win_margin_start, decaying linearly to win_margin_end over
# margin_warmup_blocks of tenure (18000 ≈ 2.5 d, DEC-CA-0049's window).
# Applies from [v2] from_block (every validator is on the release by then),
# so no vote: DEC-CA-0049's 0.4 -> 0.2 keeps judging toto2 eras. A round that
# falls back to LEVEL units keeps the level bar. Testnet leaves these unset
# (its v2 is live; setting them would change its verdicts at once).
win_margin_start     = 0.10
win_margin_end       = 0.01
margin_warmup_blocks = 18000
# The king check's pool bar (DEC-CA-0055 item 4) — kept SEPARATE from the
# dethrone bar above and FIXED (no tenure decay): the king vs the init in
# increment units, so 0.2 ≈ an LCB of 0.2 % relative improvement over the
# init (the statistic is capped at 2). 0.0 = follow the dethrone bar.
king_check_margin = 0.2

[v2.training]
# The supplied pyramid ladder replaces the earlier v2 candidate.
# Fresh lineage; historical [training] and moe_model.py are unchanged.
# Explicit update budget, not an estimated GPU-throughput measurement.
