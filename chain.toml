# ── MarketCast: lane-C fine-tune eval on Timestral-28M (DEC-CA-0064) — BUILT, SHIPPED OFF ──
# Fine-tunes of a PINNED third-party base (mistralai/Timestral-28M, Modified
# MIT licence with a USD 20M/month revenue restriction that extends to
# derivatives — owner/legal open item) are judged paired vs the untouched base
# on forward-only market windows, one lane-C slot per suite (target
# "mkt:<suite>", listed in [lane_c] targets). Arming (from_block > 0) is
# load-checked: an era boundary >= [v2] from_block and >= [lane_c] from_block,
# [v2] bench_source = "validator" in force (the main validator's GPU scores
# MarketCast), [netconfig] owner_hotkey set, base pinned, and a built data
# source for every class that lists assets. Base, activation and data contract
# are release-only; listed numeric verdict/payout/liveness controls allow overlays.
[marketcast]
from_block         = 0                          # off; an era-boundary block arms it
base_ref           = "mistralai/Timestral-28M@180698bbf5a50dda3516aa6419798437fb03a430"
base_sha256        = "dfc83c6220937ce5fc6687b35a4df94cd25e28a2cfe6fb92a23dad6301b2015d"  # model.safetensors (HF LFS oid)
base_arch          = "timestral"
suites             = ["returns", "vol"]         # launch set; also range | funding | liquidity | alpha
coverage_levels    = [0.5, 0.8, 0.98]           # calibration gate on mkt:returns AND mkt:vol
coverage_tolerance = 0.05                       # owner-tunable: fail if empirical < nominal - tolerance
alpha              = 0.05
gain_margin        = 0.01                       # never 0
# Gain-tiered full-pay period of an mkt: win (owner 2026-10-20), on lane C's
# slot TTL and decay: [[lcb_threshold, full_eras], ...] like [lane_c]'s, but
# its OWN table — the MarketCast LCB is a horizon-equal clustered geomean gain
# on one suite's loss vs the pinned base, not lane C's sqrt(WQL*MASE) gain vs
# the king, so one threshold is not the same evidence in both. Overlay-settable;
# full_eras <= [lane_c] win_ttl_eras
# (load-checked). UNCALIBRATED PLACEHOLDERS.
full_pay_tiers     = [[0.05, 10], [0.02, 5], [0.01, 2]]
min_windows        = 200                        # spread over >= min_time_blocks (review M10)
min_clusters       = 8                          # distinct (asset class, time block) clusters
pool_prefix        = "pool_mkt"
max_context_length = 32768
embargo_days       = 30                         # recipe training data ends this long before submission
max_synthetic_fraction = 0.5                    # miner generator share of the training mix
eval_context_length = 4096                      # context steps the base and the fine-tune both see
windows_per_cell   = 48                         # per (asset, horizon), spread evenly: 2 per 6 h block over 6 days
start_margin_seconds = 3600                     # windows start >= 1 h after the train block
verdict_wait_blocks = 43200                     # an entry waits up to 6 days for its windows to close
snapshot_days      = 21                         # realized 1m bars per eval snapshot
coarse_history_days = 180                       # hourly bars for >= 1h series (HL serves ~208 d of 1h)
report_timeout_settlements = 8                  # trainer records a missing report "absent" after this
max_infra_deferrals = 8                         # main-validator compute failures before an uncharged drop
cluster_block_hours = 6                         # bootstrap clusters = asset class x 6 h block
min_time_blocks    = 8                          # >= 2 days of distinct 6 h blocks before a verdict
min_bar_coverage   = 0.8                        # live-bar share in the 24 h before a window
min_dollar_volume_24h = 1000000.0               # USD traded in the 24 h before a window (0 = off)
coverage_tolerance_over = 0.10                  # gated levels also fail above nominal + this
coverage_gate_levels = [0.5, 0.8]               # per horizon, class-weighted like the gain; 98 % report-only
# Red-team fixes 2026-10-20 (DEC-CA-0064 §Red-team fixes). The gain is a
# geomean over cells (asset class x 6 h block x horizon) of each cell's ratio
# of MEAN CRPS — never the log of one window's CRPS (that rewarded too-narrow
# quantiles against an oracle base). No filter reads the realised target.
zero_scale_frac    = 0.001                      # cell masked (recorded) if base mean CRPS <= this x its horizon's median cell
cell_ratio_cap     = 4.0                        # each cell's ft/base ratio clipped to [1/4, 4]
tail_levels        = [0.05, 0.95]               # tail gate: hit rate beyond q_l within tail_tolerance of 5 %
tail_tolerance     = 0.025                      # per horizon AND pooled over horizons
calibration_z      = 3.0                        # every calibration tolerance >= 3 standard errors (thin classes)
near_dup_tol       = 0.02                       # mean |dq| / base 5-95 % width vs a senior entry below this => duplicate
max_open_legs_per_coldkey = 1                   # trainer policy: open MarketCast legs per coldkey

