# Single source of truth for active subnet configuration. Miners, the trainer,
# and validators all read this file via cascade.shared.config. Schema is versioned.
# Rationale for these settings lives in docs/ (ARCHITECTURE.md, VALIDATOR.md).

schema_version = 1

[subnet]
netuid = 91                      # MAINNET netuid
name = "cascade"
description = "Synthetic time-series training data, KOTH on CRPS + MASE of a Toto2-4M trained from scratch."

[generator]
# Bounds the trainer enforces on every generator's output; a violation
# disqualifies the generator for the round.
corpus_n_series      = 16384     # legacy exact-count drain; superseded while corpus_target_points
                                 # is armed (below), still the probe/off-switch denomination
min_length           = 64        # per-series length band (timesteps)
max_length           = 4096      # keep in lockstep with [training] context_length
max_total_points     = 2_000_000_000
# Points-denominated materialised drain (DEC-CA-0031): the cache_reuse /
# `cascade verify` drain stops at this many cumulative values-points instead of
# at a fixed series count — 67_108_864 = 16384 × 4096, today's corpus size, but
# a miner may now spend it as 65k×1024 (or any shape inside the length band).
# GP/kernel draws scale ~cubically in length, so the fixed count pinned those
# priors into their worst corner; freeing the count is what makes them
# affordable inside max_generate_seconds. Inert for the live stream_cpu feed
# (which already stops at the training token budget) and for the dedup probe
# (count-denominated by construction). Not in contract_digest — no [generator]
# key is — so this is an operational (trainer-side) knob, no coordinated
# restart. 0 = legacy exactly-corpus_n_series drain.
corpus_target_points = 67_108_864
max_generate_seconds = 7200      # batch-drain budget: RLIMIT_CPU + wall for a materialised
                                 # (cache_reuse / verify) generator run. 1800 → 7200
                                 # (DEC-CA-0031): at 1800 every measured GP-prior was 13–116×
                                 # over budget; 7200 admits the gp prior at L=4096 with the
                                 # relative-jitter Cholesky (docs/MINER.md) and the cheaper
                                 # priors at reduced length under corpus_target_points.
                                 # RLIMIT_CPU sums across threads (multiprocessing is a
                                 # blocked import), so multi-core BLAS burns it faster —
                                 # single-thread your linear algebra.
# Streaming per-frame stall window (seconds between series before the child is
# killed). Split out of max_generate_seconds (DEC-CA-0031) so the batch-budget
# raise above does NOT widen how long a stalled generator can idle a heat/final
# lane — 1800 preserves the pre-split streaming behaviour exactly. 0 = fall
# back to max_generate_seconds.
stream_stall_seconds = 1800
max_memory_mb        = 4096      # rlimit for the generation sandbox
max_repo_mb          = 128       # cap on the fetched submission (code-only, no weights)
max_channels         = 1         # per-series variates; 1 = univariate
# The record carrier (DEC-CA-0020). interface_version 1 = record-or-array yield
# with `values` only; every reserved field (mask, start, freq, group_id, roles,
# labels, quantiles) is hard-rejected until the release that consumes it. Bumps
# only when a field is accepted+consumed together (the accepted set then folds
# into [training] — one deliberate contract_digest bump).
interface_version    = 1
# Carrier cap in canonical payload BYTES — the denomination that stays correct
# when non-values fields arrive. Originally 16e9 = max_total_points × 8
# (float64), calibrated to the MATERIALISED DRAIN and "numerically inert" by
# design. v0.6.0 (d4141d8) armed it on the cumulative live STREAM, where a
# full-budget run legitimately serves token_budget × 8 bytes (finals: 40B
# tokens ≈ 320 GB) — every r33 run silently stopped at ~2.0B tokens (~5-15%
# of budget; OPSLOG 2026-08-21). HOTFIX: raised above the largest stream
# budget so the consumer's token-budget stop binds again (pre-v0.6.0
# semantics); drains stay memory-guarded by max_total_points. Restore a
# stream-shaped cap (per-corpus, cycling-aware) in v0.6.1. 0 disables.
max_payload_bytes    = 400_000_000_000
# Per-series cap on the masked fraction, active only once "mask" is accepted
# via [training] accepted_fields (DEC-CA-0023).
max_missing_frac     = 0.5
# Channel-redundancy gate (DEC-CA-0026): "off" | "shadow" | "enforce" against
# max_channel_corr (max off-diagonal |Pearson| between standardized channels).
# 0.999 targets ONLY the jitter-duplicate exploit. Keep off until the Stage 1
# shadow telemetry (channel_telemetry.frac_over_0999) clears honest
# generators; then shadow; enforce last. Meaningless at max_channels = 1.
channel_corr_mode    = "off"
max_channel_corr     = 0.999
# Structural data-quality gates (enforced by the trainer and `cascade verify`).
max_abs_value        = 0.0       # reject series whose peak |value| exceeds this; 0.0 = float32 ceiling
reject_constant      = false     # reject flat (zero-range) series
max_dup_fraction     = 0.05      # cache_reuse only: max fraction of exact byte-duplicate series; 1.0 disables
# Generation sandbox (trainer-side; never folded into contract_digest).
#   subprocess — rlimited child in a network namespace with a socket guard (default)
#   container  — same child inside docker/podman with hardened flags; requires a
#                digest-pinned sandbox_image and its sandbox_python
sandbox_mode   = "subprocess"
sandbox_image  = ""              # e.g. "ghcr.io/tensorlink-ai/cascade-worker@sha256:<64hex>"
sandbox_python = "python3"       # python inside sandbox_image
sandbox_strict = false           # true on production: no netns => refuse, don't degrade.
                                 # MUST be true (or container mode) before the dedup
                                 # probe is armed (dedup_probe_series > 0): the probe runs
                                 # generator code on the orchestrator, which holds the
                                 # eval pool and wallet (DEC-CA-0008). Left false at merge
                                 # because worker pods are UNVERIFIED under strict — flip
                                 # is its own change, after verifying pods, testnet first.

[training]
# The FIXED training contract — identical for king and challenger; folded into
# contract_digest. Trains a Toto2 backbone from random init on each corpus.
# Arch integers verified against Datadog/Toto-2.0-4m config.json (2026-07-02).
base_arch          = "toto2"
arch_preset        = "toto2-4m"
base_arch_digest   = "953e40d292e037ea07ffea25ae1fdf2e8b7dc8990276c081fa67fb4371396147"  # sha256 of frozen arch+init; recompute with `cascade-trainer --offline`
# architecture (head_dim fixed at 64 across the Toto2 family; patch_size 32)
d_model            = 256
num_layers         = 4
num_heads          = 4
head_dim           = 64
patch_size         = 32
mlp_expansion      = 2
d_ff               = 688         # exact FFN hidden width from the released config.json
num_quantiles      = 9           # 9-level pinball head (0.1..0.9) — matches [eval]/scoring
# objective / masking (Toto 2.0 Contiguous Patch Masking + quantile head)
masking            = "contiguous_patch"
cpm_c_max          = 16
cpm_p_max          = 0.4
input_transform    = "arcsinh_causal"
# I/O lengths — must match [eval] so the trained model fits the eval windows
context_length     = 4096
horizon            = 64
# From-scratch budget, enforced as a fixed token count (hours × ref throughput)
# so king and challenger see identical compute; max_train_seconds is the hard guard.
target_train_hours          = 3.0
ref_throughput_tokens_per_s = 3700000  # 20x (2026-07-15): L40S is ~20x the old 185k ref, so it was
                                        # finishing the budget early; 20x the TOKEN budget, same 3h wall
warmup_fraction             = 0.05
batch_size                  = 64       # Toto 2.0 global batch size
# optimiser (u-muP transfer: tune once on a small proxy width, pin the result)
optimizer          = "normuon_adamw"
base_lr            = 4e-3        # u-muP width-independent learning rate
weight_decay       = 2e-8        # ARMED 2026-08-27: part of the DEC-CA-0035 cut
                                  # (see the armed block below; was 0.05)
lr_schedule        = "wsd"       # warmup-stable-decay (DEC-CA-0018): warmup only on a
                                  # from-scratch (generation-start) run; warm-started rounds
                                  # re-enter FLAT at base_lr — per-round cosine restarts
                                  # distort continued pretraining. No in-round decay by
                                  # default; finished form is a separate armable mechanism
                                  # (fork-anneal below, DEC-CA-0029 — or EMA, ema_decay,
                                  # DEC-CA-0033; arm at most ONE). wsd rounds also
                                  # write optimizer.safetensors (~3x checkpoint size) so Muon
                                  # momentum/row-EMA/AdamW moments survive the round boundary.
                                  # [training] edit ⇒ contract_digest changed: restart trainer
                                  # AND validator together (flipped from warmup_cosine 2026-08-14).
# anneal_fraction  = 0.15         # fork-anneal (DEC-CA-0029, wsd's deferred "D"): each run ends
                                  # with a cosine decay base_lr -> 0 over this fraction of extra
                                  # tokens; the ANNEALED weights become the scored checkpoint
                                  # (weights.safetensors) and the mid-stable branch rides beside
                                  # it (weights_stable.safetensors + optimizer.safetensors) for
                                  # warm-start continuity. Wall stretches by the same fraction.
                                  # OFF (0.0) = today's mid-stable artifacts, digest untouched.
                                  # ARMING CHECKLIST (a contract cut, the 2026-08-14 playbook):
                                  # testnet full cycle first; recompute contract_digest
                                  # (cascade-trainer --offline); coordinated release-then-activate
                                  # with ALL external validators; OPSLOG entry. NEVER together
                                  # with ema_decay (DEC-CA-0033 — the trainer refuses) or with
                                  # [telemetry] bench_anneal_fraction: one finished-form
                                  # mechanism at a time.
# Toto2-aligned optimizer constants (DEC-CA-0035, all digest-bound
# drop-when-default; defaults = the previously hardcoded trainer behavior).
# MEASURED 2026-08-27 (docs/notes/2026-08-27-toto2-alignment.md): the full
# bundle @ warm_lr_scale 0.125 BEATS the converged warm-start init by
# 0.0038 ON THE EMA-999 ARTIFACT — the raw endpoint stays slightly above
# init, so the cut only delivers its headline WITH the EMA finished form.
# ARMED 2026-08-27 (owner): the full DEC-CA-0035 cut, one contract cut for
# rounds from block 8942400 (see [scoring] contract_from_block — rounds
# before it verify against prior_contract_digest). The constants were swept
# together (arXiv 2605.20119); ema_decay 0.999 is the DEC-CA-0033 artifact
# the measurement scored — the cut only delivers its headline WITH it.
# weight_decay is set to 2e-8 above as part of this same cut. NEVER together
# with anneal_fraction or [telemetry] bench_anneal_fraction (the trainer
# refuses). NOTE: armed ahead of the wave-3 cross-generator separation check
# on owner direction — watch the first armed rounds for separation loss.
ema_decay       = 0.999         # EMA finished form (DEC-CA-0033; the scored artifact)
gen_seed_mix    = 3             # DEC-CA-0033 N-seed generation mix (owner-armed
                                # 2026-08-27: measured working at 3 seeds) — corpus
                                # digest = rolling digest of the interleaved stream
                                # (~1/3 budget per derived seed, ~sqrt(3) less
                                # generation-seed noise)
muon_momentum   = 0.96          # Muon Nesterov momentum (default 0.95)
muon_row_beta2  = 0.999         # NorMuon row second-moment EMA (default 0.95)
grad_clip       = 7.0           # train-loop grad-norm clip (default 1.0)
adamw_beta1     = 0.91          # AdamW group betas (defaults 0.9/0.999)
adamw_beta2     = 0.972
adamw_lr_scale  = 0.018518518518518517   # 1/54 matrix:AdamW split (default 1.0)
warm_lr_scale   = 0.125         # warm-started runs train at base_lr x this;
                                # from-scratch keeps full base_lr (default 1.0)
umup_base_d_model  = 256         # proxy width the HPs were tuned at
train_seed_salt    = 1337        # mixed into the (shared) training seed
max_train_seconds  = 10800       # hard wall-clock cap; a time stop is flagged deadline_hit
# Corpus feed mode (folded into contract_digest):
#   stream_cpu  — live-stream from a CPU generator; byte-exact reproducible
#   stream_gpu  — live-stream from a GPU generator; tolerance/same-hardware audit
#   cache_reuse — draw a fixed corpus once, multi-pass under the budget; byte-exact
corpus_mode = "stream_cpu"
# Accepted record-field set (DEC-CA-0020 layer 3): the payload fields the
# carrier accepts AND the trainer consumes — accept-equals-consume is enforced
# in code (only fields with a wired consumer load). DIGEST-BOUND via the
# drop-when-default convention: [] is omitted from contract_digest (today's
# digest is untouched), setting it is a deliberate bump → coordinated
# epoch-boundary restart, the routine re-pin protocol. Arming order per the
# roadmap: "mask" needs the pool's masked-history eval slice first; "roles"
# values 0/1 may arm with multivariate, allow_future_known (roles=2) stays
# false until docs/EVAL_POOL.md carries the covariate exogeneity rule.
accepted_fields    = []
allow_future_known = false
# Owner-published shared real corpus (DEC-CA-0028): immutable ref
# ("repo@sha256:<64hex>") of the frozen, licensed real-data corpus generators
# may READ (opt-in real_corpus_dir constructor kwarg; repos stay code-only).
# DIGEST-BOUND via drop-when-default: "" is omitted from contract_digest, so
# today's digest is untouched; setting it is the deliberate bump. Arming is
# FORBIDDEN until docs/EVAL_POOL.md carries the corpus/eval-pool disjointness
# rule (provenance + time wall) and the DEC-CA-0028 pricing experiment has run.
real_corpus_ref    = ""
# Pin the GPU SKU (exact torch device name). Empty = king and challenger must
# match each other. Unpinned 2026-09-02 for per-round GPU choice
# ([round] funded_pod_skus); folds into contract_digest — coordinated deploy.
expected_gpu = ""                # was "NVIDIA L40S" (DEC-CA-0002)
# Pin the training-runtime image (digest-pinned worker-image ref) and inject the
# same digest as CASCADE_TRAIN_IMAGE_DIGEST into each pod env; final runs refuse
# a mismatched runtime. Folded into contract_digest. Empty = unpinned.
# worker-v0.6.0 (2026-08-20, CI run 32427927572, built from main@b42f768 —
# the full 8-PR go-live stack): bakes WSD + optimizer-state sidecar
# (DEC-CA-0018), tie-aware cohort trainer (DEC-CA-0012), hub-fetch hardening
# (#206, ends per-pod hippius patching), heat infra requeues (#207), bench
# prewarm (#204). v0.5.0 retired:
# sha256:0b90d44b7ca11c2c2964bc4df687033b489cdc8127a8dcbdb4c91303163b6f57
train_image_digest = "sha256:3c373d5b7d425fabb705ea009e3f11207114e5e32f80194c437d3b266076df4f"
# ^ ghcr.io/tensorlink-ai/cascade-worker@worker-v0.4.0 (2026-07-23, built from
# 1325409 — [wandb] extra baked, warm-start worker plumbing, incident-hardening
# trainer code; torch/generator-dependency stack unchanged from v0.3.1).
# NOTE the baked chain.toml inside the image carries an EMPTY pin (an image
# cannot contain its own digest — worker-v0.3.1 protocol).
# Prior pin: sha256:2126219a8909797e313b1688ff7b27a666eb7376652cd0d322e229e91cfe01b4
# (worker-v0.3.1, 2026-07-16, built from 56d40c7).
# NOTE the baked chain.toml inside the image carries an EMPTY pin (an image
# cannot contain its own digest); enforcement is launch-env injection + the
# provisioner health gate, and contract_digest is computed orchestrator-side
# only.
# Prior pin: sha256:f08d8c52a19616… = ghcr.io/tensorlink-ai/cascade-worker@worker-v0.3.0
# (2026-07-15, built from ed2f4a1 — 20x budget but MISSING the [dependencies]
# generator allowlist; generators importing pandas failed heats — do not reuse).
# Prior pin: sha256:46bc78fa0ddd… = ghcr.io/tensorlink-ai/cascade-worker@worker-v0.2.0
# (built from main incl. PRs #76–#98; bakes the OLD 185k budget — do not reuse).
# Re-pin protocol: the digest folds into contract_digest ⇒ trainer AND
# validators restart together at an epoch boundary, pods pull the new image.

# Extra final-stage model sizes. Each [[training.sizes]] is trained alongside
# the primary in the final; the throne is decided on the COMBINED score. A size
# overrides only shape fields + digest + throughput; all else inherits [training].
#
# 20M (Toto2-22M) is DISABLED at launch. Before enabling: pin the arch to the
# released Datadog/Toto-2.0-22m config.json, measure throughput, and recompute
# base_arch_digest with `cascade-trainer --offline`.
# [[training.sizes]]
# arch_preset                 = "toto2-22m"
# base_arch_digest            = "c7ecca53ed939eabfc34ccdb8a698d69101526c24f299efa21c0c0c288c96792"
# d_model                     = 512
# num_layers                  = 8
# num_heads                   = 8       # head_dim stays 64 ⇒ d_model = num_heads × 64
# mlp_expansion               = 2
# ref_throughput_tokens_per_s = 90000   # MEASURE on the reference GPU for THIS size
# Size-conditional overrides (DEC-CA-0027; unset = inherit [training]):
# expected_gpu       = ""     # per-size duel GPU pin (exact nvidia-smi string;
#                             # 300M+ pins H100-class — mind SXM vs PCIe variants,
#                             # and measure ref throughput on THAT variant)
# target_train_hours = 0.0    # per-size budget hours (313M increments ~6h; set
#                             # jointly with the margin re-unitisation from the
#                             # null-LCB noise-floor measurement)

[round]
# Twice-daily round cadence + two-stage (heat → final) selection. The base seed
# is the chain block hash at the epoch boundary; only commitments revealed
# strictly before the boundary are eligible.
#
# 7200 → 3600 on 2026-07-28 (owner): halve the round to double throughput.
# CONSENSUS-RELEVANT — every validator derives the epoch from this for
# pool-snapshot selection (validator/loop.py:726), so it must land in LOCKSTEP
# across operators exactly like a scoring-rule change. Nothing detects a stale
# value; a validator on 7200 silently selects a different snapshot.
# Not part of contract_digest (that is [training] only), so no digest recompute
# and no manifest invalidation.
# The heat fleet needs NO manual resize: plan_fleet (provision/policy.py:218)
# derives it from this value every round —
#   heat_slots = ceil(n × heat_train_hours × slot_overhead / (epoch_h − final_h))
# so 24h/n=31 → 2 slots → 1 pod (4 GPU) becomes 12h/n=31 → 5 slots → 2 pods
# (8 GPU); at the observed peak field n=48 → 7 slots → 2 pods. max_pods = 8
# (32 GPU) stays well clear. Do NOT hand-pin gpus_per_pod/max_pods to "help" —
# that overrides the derivation and over-rents on quiet rounds.
epoch_blocks     = 3600   # ≈12h at a 12s block time
round_hours      = 12.0   # informational: wall-clock span of an epoch
# Scheduled switch (0/0 = steady state). Last used: 7200 → 3600 at 8726400,
# 2026-07-29. To schedule another, the block must be a boundary of BOTH grids
# (load-checked); set both back to 0 once it is safely past.
epoch_blocks_prev      = 0
epoch_activation_block = 0
heat_train_hours = 1.0    # screening budget per competitor (on screen_size).
                          # 0.5 → 1.0 on 2026-07-26 (owner): lower-noise heat
                          # ranking; watch p_best / leader_lcb to confirm it pays.
heat_n_windows   = 2000   # eval windows the heat screens on
                          # 256 → 2000 on 2026-08-07 (owner): screen on the full
                          # [eval] n_windows — two straight record-setting
                          # challengers showed the 256-window screen is noisy
                          # near the top. ~34s/ckpt CPU (vs ~4s), ~17min/wave,
                          # still inside the 1h wave-training shadow.
heat_num_samples = 100    # sample forecasts per window in the heat (0 = reuse [eval] num_samples)
                          # 20 → 100 on 2026-07-27 (owner): match the final's
                          # sample count so the screen ranks on the same
                          # estimator the duel decides on. Finite-sample CRPS
                          # bias grows with predictive spread, so a 20-sample
                          # screen mis-prices wide-distribution checkpoints
                          # relative to the 100-sample verdict. Measured cost:
                          # ~5.4s → ~30s per entrant (20-entrant field ≈ 10min).
# Heat wall-clock cap: max(heat_guard_factor × heat_train_hours, floor), never
# above max_train_seconds. RAISE the factor if heat pods are a slower SKU than
# the reference box, else every heat time-truncates.
heat_guard_factor        = 1.0
heat_guard_floor_seconds = 900
# In-round re-queues for challengers whose heat dispatch died on an
# INFRASTRUCTURE failure (storage layer / ssh transport) — miner-fault
# failures never re-queue. 0 restores terminal drops.
heat_infra_requeues      = 2
finalists        = 1      # challengers promoted from the heat to the final (top-N)
# Tie-aware finalist cohort (DEC-CA-0012, trainer half) — ARMED AT RELEASE
# (owner 2026-08-20, max_finalists = 3). With max_finalists > 1 the finalist
# count responds to the
# screen's own statistic: a leader the screen separated from every other
# entrant (the lcb_vs/leader_lcb diagnostic already logged on the heat block)
# advances ALONE whatever the cap; a statistically tied top is re-scored on a
# larger eval slice — CPU-only on the orchestrator, incremental windows
# [heat's slice, tie_runoff_windows) via the seeded-prefix property of the
# round's window permutation, no retraining, no GPU rent — and whoever still
# cannot be separated advances too, capped at max_finalists. The screen's drop
# bar is 0 (not the duel's 2% margin) and deliberately UNCORRECTED for
# multiplicity: a field-size-dependent bar is gameable by padding the field;
# the cap plus the run-off are the controls. The validator judges the WHOLE
# advanced cohort under a family-wise alpha/k and crowns the best
# margin-clearer (that half shipped 2026-08-11 and is a no-op at k=1).
# At these defaults everything is bit-identical to today: one finalist,
# duel_rank stays 0 on every entry, manifests hash as before.
# NOTE: tie_runoff_windows MUST STAY 0 while the jittered mix (DEC-CA-0019)
# is active: the run-off scores windows_for_round(seed, stop)[start:], which
# assumes the draw is a permutation PREFIX. The jittered draw is not — and
# mix_target_windows overrides the requested size outright, so a "larger"
# draw returns the same 1200-window list and the tail is overlap, not
# incremental evidence. A run-off with no incremental windows is skipped and
# the tied set advances capped (the supported path). Re-arming the run-off
# needs a jitter-aware incremental draw first (revisit in DEC-CA-0012).
# ARMING ORDER (not cosmetic; DEC-CA-0012 rollout): testnet arms FIRST
# (chain.testnet.toml), trainer and validator restarting together. Mainnet
# does NOT restart onto this config until a full testnet round has produced
# a genuine multi-finalist cohort duel AND cascade-audit has replayed it —
# the 2026-07-30 JIT incident existed precisely because a config flip
# live-exercised a never-run path. Pre-arm couplings VERIFIED 2026-08-20
# against the deployed provisioner config:
# (1) fleet check at 1 + max_finalists = 4 slots: final = ceil(4/2) = 2 pods
#     = max_pods exactly (NOT clamped); within_budget worst case = 12 heat
#     pods x $2.60 x 12h + 2 final pods x $3.00 x 12h = $446.40 <= $500;
# (2) [eval] bench_hold_max_hours raised 6.0 -> 9.0: the post-publish bench
#     is SEQUENTIAL per pod, so a k=3 cohort is 4 legs; 9h covers them at 2x
#     the observed ~1h/leg while staying inside the ttl_epochs=1 (12h) pod
#     lifetime measured from the JIT final rent. Past the hold, later cohort
#     members drop out of the promotion candidate pool (soft degradation).
max_finalists      = 3    # cap on the advancing tied cohort (armed 2026-08-20; 1 = tie logic OFF)
# Init-baseline heat SHADOW row (DEC-CA-0034; armed 2026-08-27, owner): the
# warm-start init is scored on the heat slice and published as
# HeatResult.init_baseline. Visibility only — never filters the heat
# (heat-side has no enforce). Trainer-only key, no consensus surface.
init_gate_mode     = "shadow"
tie_runoff_windows = 0    # MUST stay 0 under the jittered mix — see NOTE above
# Wall clock for the WHOLE run-off, mirroring dedup_phase_seconds: on expiry
# the pre-run-off tied set advances (capped) — a screen that cannot finish
# must not sink the round it protects. Inert while max_finalists = 1.
tie_runoff_phase_seconds = 900
# Anti-spam: a challenger hotkey that has entered a heat is burned and must
# re-register to resubmit. Set false only on a throwaway testnet.
# Go-live gate: only commitments revealed at/after this block ever compete
# (0 = off). MAINNET: set to the announced launch block AT LAUNCH so netuid
# squatters / rehearsal commits from before the official start never enter a
# round (and never burn their one submission).
commit_floor_block = 8622922  # OFFICIAL GO-LIVE BLOCK (deliberate): reveals before this never compete
                              # (unit fixtures neutralize it in tests/conftest.py)
one_submission_per_hotkey = true
# ── Miner-funded compute (DEC-CA-0036) — armed, block-gated ──────────────────
# "off" / "shadow" / "required" (funded queue IS the field; every seated
# entrant duels, no heat). Everything below is inert before
# funded_activation_block; legacy rounds keep running until it.
# Details: docs/MINER_FUNDED_ROUNDS.md.
funded_mode = "required"
funded_activation_block = 8992800   # go-live ≈ Fri 2026-09-04 08:30 UTC (owner)
funded_queue_path = "funded_queue.json"   # shared with cascade-intake (work_root-relative)
# With funded_mode = "required": an unfunded boundary runs NOTHING (no king
# leg, no pods, no manifest — validators just see no manifest and hold).
# This is the elastic-cadence floor; the ceiling is the epoch grid itself.
skip_unfunded_rounds = true
max_rounds_per_day = 2                    # cadence sizing/telemetry only (grid = epoch_blocks)
funded_entry_ttl_hours = 36.0             # MUST track cascade-intake --ttl-hours (key TTL)
# "rent": each funded leg rents ONE pod on its payer's Lium key (king + eval
# stay operator-funded). Consensus-inert.
funded_pods = "rent"
payer_vault_dir = "payer_vault" # cascade-intake --vault-dir (work_root-relative)
funded_pod_sku = ""             # unused with funded_pod_skus set (per-round pick)
# Worker image funded pods boot — keep = the fleet's pinned digest.
funded_pod_image = "ghcr.io/tensorlink-ai/cascade-worker@sha256:3c373d5b7d425fabb705ea009e3f11207114e5e32f80194c437d3b266076df4f"
funded_ready_timeout_seconds = 900.0
# Seats per round (0 = finalist_cap); clamped to live market capacity minus
# the king's reserve when the probe is on. Held-back seats wait unburned.
funded_field_cap = 8
funded_capacity_probe = true
funded_capacity_reserve = 1
# Allowed GPU types, preference-ordered; each round runs entirely on the
# most-available one (king included). Needs [training] expected_gpu = "".
# Blackwell (RTX5090, B200/B300) waits on a torch cu12.8 re-pin.
funded_pod_skus = ["RTX4090", "RTX3090", "L40S", "L40", "A6000"]
# King pod rents JIT at the round's SKU (operator-billed); retire the
# provisioner's final stage — the trainer ledgers and sweeps these pods.
funded_king_rent = true
# Direct submissions + champion-only publication (DEC-CA-0036, second half;
# SHIPPED INERT): code POSTs straight to cascade-intake (same request as the
# Lium key), lives in the operator-private store below, and rides the chain as
# an ordinary hippius payload under the reserved vault/direct namespace — no
# validator change, no digest change. Only a THRONE publishes (champions/
# on the manifest bucket, sn100-top-model style): "crown" immediately,
# "delay" after N reign rounds, "dethrone" at hand-off (every policy reveals
# a deposed vault king at latest). Losers stay private forever.
submission_vault_dir = ""                 # "" = direct submissions off (work_root-relative)
champion_publish = "off"
champion_publish_delay_rounds = 2
# Content-level duplicate screen (pre-heat): re-uploads, comment shuffles,
# and rename-only copies of the king or an earlier-committed challenger lose
# their heat slot; the earliest submission keeps it. Pairwise only — never
# transitive clusters. Dropped copies still burn their one submission.
# NO similarity threshold: a ratio bar (originally sim >= 0.99, with a sketch
# tier for oversize streams) is gameable by spacing edits just under it —
# operators were already laddering variants at 0.90-0.986 — and it produced
# the one confirmed false positive (a round's eventual finalist). Drops ride
# on EXACT identity only: same tree, same normalized tokens, same tokens
# modulo renames — and same probe OUTPUT once dedup_probe_mode enforces (a
# zero-delta re-roll produces byte-identical probe bytes, so the spam a
# threshold would target is caught ungameably).
# ENABLED enforce 2026-07-26 by owner decision (DEC-CA-0008). The live-shadow
# step was substituted by offline replay of the real screen on rounds
# r1206/r1207/r1208 (drops: 2/0/0, all exact-identity or denied refs — zero
# similarity-based verdicts possible since the threshold was removed).
dedup_mode         = "enforce"   # off | shadow | enforce (exact tiers)
# config_only tier (identical .py, differing configs): SHADOW-logged until
# this is true — config sweeps are ticket-spam AND the legitimate fork path.
dedup_config_only_enforce = false
# Cost caps: tokenizer input is attacker-chosen up to max_repo_mb (~2s/MB);
# the retained-token cap bounds the config_only delta measurement, the only
# quadratic pass left. Field repos are ~100KB / 7-11k tokens (~40x headroom).
dedup_max_tokens   = 50000       # 0 = uncapped; do NOT run 0 in production
dedup_max_text_mb  = 4           # tokenizer input budget per repo
# Wall clock for the WHOLE screen. On expiry the field proceeds unscreened: a
# screen that cannot finish must not sink the round it protects.
dedup_phase_seconds = 900
# Behavioral probe: sandbox-draw N series per surviving entrant under the
# shared round seed, twice. Twice-differs = non-deterministic generator
# (contract violation, the entropy re-roll). Identical probe bytes across
# entrants/vs-king = same process regardless of code. Probe drops gate on
# dedup_probe_mode INDEPENDENTLY of dedup_mode — within-family heat spreads
# suggest nondeterminism is widespread, and probe drops burn hotkeys, so the
# probe ships SHADOW while the static tiers enforce.
dedup_probe_mode   = "shadow"    # off | shadow | enforce
# Probe OFF (owner, 2026-07-26): the probe EXECUTES miner code on the
# orchestrator even in shadow (shadow gates the drops, not the execution).
# To arm later: verify worker pods + this host under [generator]
# sandbox_strict = true (or container mode), flip that first, then set
# series = 8 with probe_mode = "shadow"; enforce only after reviewing
# shadow verdicts. The static tiers above are independent and stay on.
dedup_probe_series = 0           # 0 = probe off
# Total probe wall clock; the per-draw budget is derived from it (budget / waves
# / 2 draws), so N hostile entrants each burning their clock cannot stretch the
# stage past this. The probe REFUSES to run unless [generator] has
# sandbox_mode = "container" or sandbox_strict = true — shadow mode gates the
# drops, not the execution, and this host holds the eval pool and the wallet.
dedup_probe_budget_seconds = 600

# Genesis baseline king (burn-until-dethroned): a PUBLIC Hippius generator ref
# (repo@digest). When set, the trainer trains THIS generator as the king
# whenever no on-chain champion has a resolvable commitment — a fixed,
# un-earnable floor — and the validator BURNS emission to burn_uid until a real
# miner dethrones it (the king entry carries a sentinel uid = -1). Empty = off:
# promote the lowest-UID miner to interim king (legacy behaviour).
genesis_generator_ref = "cascade/genesis-baseline@sha256:56c68bdac31718db7c59708c9678b19347fe7ef2f8a696bdd5f3ad4548e17a65"
# submissions_db_path = "trainer_submissions.json"  # relative ⇒ under --work-root
# Timed-reveal safety margin (blocks): `cascade deploy` targets its timelock
# reveal at `epoch boundary − reveal_margin_blocks` — hidden all window, public
# only the last ~5 min. Must absorb commit-inclusion + drand reveal jitter (a
# reveal at/after the boundary misses the round) while staying under a copier's
# automated turnaround. Tighten only after measuring jitter on a live round
# (scripts/measure_reveal_jitter.py).
# Deliberately UNCHANGED by the 2026-07-28 24h → 12h round switch. This is an
# absolute quantity anchored to the boundary: both terms that size it — chain
# jitter and copier turnaround — are properties of the chain and the adversary,
# not of the round length, so halving it alongside epoch_blocks would cut the
# jitter headroom for no reason. The only coupling is the public-exposure
# fraction, 25/7200 = 0.35% → 25/3600 = 0.69% of a round: still negligible.
# Sole hard constraint is reveal_margin_blocks < epoch_blocks (25 < 3600).
reveal_margin_blocks = 25
# Scaling seam: which size the heat screens at, and which size(s) decide the
# throne. arch_preset names from the size registry; >1 throne size = combined score.
screen_size  = "toto2-4m"
throne_sizes = ["toto2-4m"]

[eval]
# Held-out eval windows, identical for king and challenger. The slice is private
# and rotates per round (seeded by block hash) — see cascade.validator.windows.
eval_dataset   = "cascade-private-v1"  # identifier the validator matches on
eval_source    = "private-rotating"    # rotating private pool (vs a fixed public set)
window_pool    = ""                    # Hippius Hub ref (repo@digest) of the held-out pool;
                                       # build/push with `cascade-pool build --out ./pool --upload`
                                       # (see docs/EVAL_POOL.md)
num_samples    = 100             # sample forecasts drawn per window
n_windows      = 2000            # eval windows drawn per round from the pool
context_length = 4096            # must match [training]; pool must supply >=4096+horizon windows
horizon        = 64

# Jittered round mix (DEC-TB-0003 port, DEC-CA-0019) — ARMED AT RELEASE,
# IMMEDIATE activation (owner decision 2026-08-20, fork risk explicitly
# accepted): rounds whose epoch boundary is >= mix_from_block draw the
# jittered mix; every earlier round keeps the legacy uniform permutation
# byte-identically (pinned by test). Block 8895600 = the 2026-08-21 08:30 UTC
# boundary — the first boundary not yet scored at deploy time (the block must
# NEVER be set in the past: audit replay and resync re-derive earlier rounds
# under each round's own rule via the receipt's epoch_start_block, so a past
# block would contradict already-published receipts). Moved 8892000 → 8895600
# on 2026-08-20 22:30: the fleet deploys in one coordinated event AFTER the
# 8892000 round is already in flight, so 8892000 would have been in the past.
# ALL validators must restart on this release before the 8895600 round's
# manifest is scored, or verdicts fork from that block until they do.
# Expected mix stays equal-weight per domain (capacity-capped); realised mix
# is unpredictable. mix_target_windows: the jittered draw size (0 =
# n_windows). Calibrated on the 2026-08-19 production snapshot: 1200 of
# ~2400 rotates the mix hard (per-domain p1–p99 spans ~6x) with effective
# domains ≥ 5.0 and P(<4.0)=0 over 2k simulated rounds; at 2000 the caps
# crush the jitter (~±7%). Class rotation (mix_class_keep_frac) is inert
# until pool snapshots carry dgp_class labels (builder change in this
# release; arm by republishing the pool).
mix_from_block       = 8895600   # ACTIVATION epoch boundary (2026-08-21 08:30 UTC); 0 = off
mix_jitter_alpha     = 4.0       # symmetric Dirichlet over domains (expectation uniform)
mix_block_slots      = 8         # allocation unit: a cell is absent or gets >= 1 block
mix_class_keep_frac  = 0.7       # per-round dgp_class activation fraction
mix_series_bag_frac  = 0.7       # per-round series eligibility (salted-hash bag)
mix_target_windows   = 1200
# DEC-CA-0032 two-tier domain split: domains too small to fill an even share
# of the draw always draw AT capacity (the flat jitter could starve them
# below even their caps); the remaining domains split the rest evenly under
# the tight tier alpha (+/-2-3pp on a ~4-domain residual set). Degenerates to
# a tight even split over ALL domains once every domain clears an even share
# — i.e. converges to uniform as pool capacity floors (300/domain) land.
# CONSENSUS: all validators must flip at the same boundary — set
# mix_tier_from_block only in a coordinated release (0 = flat split).
mix_tier_from_block  = 8942400   # ARMED 2026-08-27 (owner): two-tier even-domain
                                 # split live from r47's epoch — same boundary as
                                 # the recipe cut, one coordinated validator update
mix_tier_jitter_alpha = 75.0      # jittered draw size; inert until mix_from_block is set
# Scored horizon ladder (PR #241): from scored_from_block the verdict draws
# one even-by-domain rung per horizon (rung sizes equalised). CONSENSUS —
# same rollout as mix_from_block; every validator must run it before the
# block. The 720 rung needs series >= 784 steps.
scored_horizons   = [64, 256, 720]
scored_from_block = 8992800      # = funded_activation_block

# Public-benchmark logging (LOG-ONLY; never feeds scoring/weights/KOTH). Runs
# out of process via the benchmarks/ sidecar; best-effort. See benchmarks/README.md.
run_benchmarks        = false    # off by default — opt in per validator
benchmark_project_dir = "benchmarks"  # path to the sidecar project
benchmark_suites      = []       # subset of ["gift-eval","boom","time"]; [] = all three
benchmark_num_samples = 0        # 0 reuses num_samples above
benchmark_max_series  = 0        # cap datasets/tasks for a fast smoke run; 0 = full benchmark
# Cascade post-publish duel bench (used only when [scoring] cascade_enabled).
# After each manifest publishes, the trainer benches BOTH duel checkpoints on
# GIFT-Eval/BOOM/TIME and publishes a separate signed report
# (benchmarks/round-<id>.json). bench_hold_max_hours caps how long the
# provisioner holds the round's FINAL pod for that sweep past its normal
# teardown signal; the hold releases early when the bench_complete marker
# lands. Inert while cascade_enabled = false.
bench_hold_max_hours  = 9.0   # king+challenger bench SEQUENTIALLY on the one final pod
                              # (same-pod parallel launches preempt each other) — sweep is
                              # ~45-60min WITH data staged; raised 3.0→6.0 (2026-08-07) after
                              # rate-limited HF downloads on token-less pods ate the 3h hold;
                              # raised 6.0→9.0 (2026-08-20) for DEC-CA-0012 cohorts: a k=3
                              # cohort benches 4 legs, and 9h stays inside the ttl_epochs=1
                              # pod lifetime measured from the JIT final rent
                              # twice. Data now pre-pushed from the box at final-rent time.
# Public-benchmark no-regression gate data (CONSENSUS; used when [scoring]
# gift_gate_mode != "off"). Enforcing validators need the data pinned locally.
gift_gate_datasets    = ""       # gift-eval config subset ("" = full 97 configs)
gift_gate_num_samples = 0        # 0 reuses num_samples
gift_gate_data_dir    = ""       # pinned benchmark data dir ("" = suite env vars)
gift_gate_timeout_s   = 3600     # per-checkpoint gift-eval timeout

[scoring]
# King-of-the-hill — tenure-DECAYING dethrone margin (DEC-CA-0016, armed at
# release by owner decision 2026-08-15): the bar a challenger must clear
# starts at win_margin_start for a fresh king and decays linearly to
# win_margin_end over margin_warmup_rounds of tenure (~1.25% by round 4,
# floor from round 8 ≈ 4 days at the 12h cadence, held forever). Tenure
# survives warm-start promotion, so a long hold defends the floor.
# CONSENSUS-SENSITIVE COORDINATED UPGRADE: margin is judged per-validator and
# this config activates the decay AT release — every external validator (6)
# and the trainer must upgrade in one coordinated window
# (docs/MARGIN_DECAY_ROLLOUT.md). While the fleet is mixed, any round whose
# challenger LCB lands between the decayed and flat margin FORKS verdicts.
# HARD GUARDRAIL: win_margin_end must stay > 0 — the floor is the safety
# property (0.5% sits above the bootstrap noise band, so a statistically
# tied challenger never wins by luck; a 0 or sub-noise floor becomes a slow
# term-limit lottery).
win_margin_start     = 0.02      # fresh-king margin (tenure 0)
win_margin_end       = 0.005     # decayed floor (> 0!) — reached at margin_warmup_rounds
margin_warmup_rounds = 8         # rounds of tenure to reach the floor (~4d at 12h rounds)
min_windows          = 200       # below this many common windows, no decision
min_clusters         = 0         # min distinct window clusters (pool `source` labels)
                                 # for a decision; raise to ~30 once the pool
                                 # carries source labels. 0 = off.
bootstrap_B          = 10000     # paired-bootstrap resamples
bootstrap_alpha      = 0.05      # one-sided LCB level
dethrone_cp          = 1         # consecutive round wins to take the throne
# Reward routing: weight split across the current king plus up to
# reward_prior_kings previous distinct kings still registered; if none are
# registered, all weight burns to burn_uid. 0 = pure winner-take-all.
reward_prior_kings   = 4
burn_uid             = 0         # weight sink (owner burn slot)
king_decay           = 0.5       # geometric decay across [king, prior kings]: king ∝ 1,
                                  # prior ∝ 0.5, 0.25, … — the king is UNAMBIGUOUSLY the
                                  # highest-incentive UID (king resolution depends on it).
                                  # 1.0 = flat split (ambiguous; do not use in production).
                                 # 1.0 = flat split, <1 skews to the current king
# Public-benchmark no-regression gate (cascade.eval.gift_gate). AND-ed with the
# private-pool decision: can BLOCK a dethrone, never grant one. Start on
# "shadow" to calibrate the tolerance before enforcing.
gift_gate_mode       = "off"     # "off" | "shadow" (log-only) | "enforce"
gift_gate_tolerance  = 0.03      # relative slack before the challenger fails
gift_gate_min_configs = 15       # shared configs below which the gate is uncomputable
# Margin denomination (DEC-CA-0027): "level" = LCB of (king-chal)/king (the
# from-scratch rule, exact current behaviour). "increment" = the warm-start-era
# rule: the shared init is scored as a third paired reference and the margin
# prices a fraction of a typical per-round improvement — flip it WITH the
# warm-start era (E2), across all validators at once ([scoring] is
# fleet-consensus). Random-init rounds are judged at "level" automatically.
# margin_increment_floor floors the increment normaliser at this fraction of
# the baseline level, so near-zero increments can't explode the statistic.
margin_mode            = "level"
margin_increment_floor = 0.01
# Cascade — king-reign promotion / warm-start (cascade.validator.cascade +
# cascade.trainer.promotion, DEC-CA-0013 propose-and-verify). After a ripe
# reign the TRAINER selects up to cascade_top_k reign checkpoints as the next
# warm-start generation (signed PromotionRecord, promotions/gen-<n>.json) and
# rotates rounds across the members; validators verify the declaration against
# the envelope below instead of re-deriving the selection. The king PERSISTS
# on promotion (DEC-CA-0004); the throne is never vacated.
cascade_enabled      = true      # ARMED 2026-08-05: warm-start promotion + post-publish duel bench live
# Consecutive undethroned ROUNDS before a Cascade fires — "survived N
# challenges". Renamed from cascade_reign_days on 2026-07-28 (the old key is
# still accepted): the clock used to divide reign blocks by a fixed 7200-block
# day, which at the 24h cadence happened to equal one round. At 12h rounds that
# same 7 would have silently meant 14 challenges. The clock is now epoch-
# relative (cascade.validator.cascade.reign_rounds), so this number means the
# same thing at any cadence and needs no re-tuning when the round length moves.
# Lowered 7 → 5 at arming (owner, 2026-08-05): at the 12h cadence, 5 rounds
# ≈ 2.5 days per promotion cycle. CONSENSUS-relevant — every validator must
# run the same value or cascades fire at different rounds (divergent pins).
cascade_reign_rounds = 5
# Promotion ENVELOPE (DEC-CA-0013). CONSENSUS-relevant like the reign clock:
# every validator must run the same values or their accept/reject verdicts on
# a declared promotion fork. cascade_top_k caps how many member checkpoints
# one promotion may declare (the trainer may declare fewer — the selection
# policy is trainer-side and free to evolve); cascade_quality_epsilon is the
# quality floor: every member's bench geomean must sit within (1 + epsilon)
# of the best verifiable score in the reign, so diversity can never be bought
# with a materially worse init.
cascade_top_k          = 3
cascade_quality_epsilon = 0.05
# Block-gated contract transition (2026-08-20, WSD flip — DEC-CA-0018): rounds
# whose epoch boundary precedes contract_from_block score against the pinned
# PRIOR contract digest (the warmup_cosine contract every round through
# boundary 8892000 trained under), so validators restart onto this release at
# any time without sacrificing the in-flight round; rounds from block 8895600
# (2026-08-21 08:30 UTC) accept only the digest recomputed from [training]
# above. Same activation block as mix_from_block — one flip boundary for the
# whole release. Fleet-consensus values: keep identical across validators.
# Retire (""/0) in the release after the transition round ages out.
# ARMED 2026-08-27 (owner): the DEC-CA-0035+0033 recipe cut takes effect for
# rounds from block 8942400 (r47's epoch, boundary 2026-08-28 ~08:25 UTC).
# Rounds whose epoch precedes it (r45/r46 in flight) verify against the pinned
# PRIOR digest below — the unarmed contract every round through epoch 8938800
# trained under — so validators restart onto this release ANY TIME before
# block 8942400 without sacrificing an in-flight round. (This retires the
# aged-out 6420f564…/8895600 warmup_cosine transition pair.)
prior_contract_digest  = "c6d2462135198c36eefc009ea0f945957e647c20bf521a1fbc9d721a4324f3af"
contract_from_block    = 8942400
# Declared-contract gating (DEC-CA-0036). From this block a manifest is gated on
# the LOCKED terms only — arch_preset, base_arch_digest, expected_gpu,
# train_seed_salt, and each extra size's preset/GPU pin — verified against the
# full training contract the trainer now publishes and signs inside the manifest
# (`contract_body`). Every other [training] term is recorded and audited but
# never rejects a round, so a trainer-side fix (runtime image re-pin, recipe
# change, budget change) ships the same day instead of waiting on six external
# validators to restart.
#
# 0 = OFF, the deployed value: every round takes the legacy strict path (full
# digest equality against the local [training]). Arming this is the LAST
# [training]-driven change that needs a coordinated fleet deploy — after it,
# [training] edits never again reject a round on an un-upgraded validator, and
# validator restarts are reserved for actual scoring-rule changes ([scoring],
# [eval], the cascade envelope). Ship the release first, let the fleet upgrade at
# its own pace, THEN set the block: rounds before it replay strict, rounds after
# replay declared, and cascade-audit judges each round under its own rule.
# Fleet-consensus value like every [scoring] key: keep identical across validators.
# ARMED 2026-08-27 (owner): live for rounds from r47's epoch, same boundary as
# the recipe cut — one validator update before block 8942400 covers both.
declared_contract_from_block = 8942400
# Init-baseline duel gate (DEC-CA-0034) in SHADOW (armed 2026-08-27, owner):
# the validator scores the warm-start init on the verdict windows and records
# init_baseline_geomean / init_floor_passed in the receipt (drop-when-None —
# archived signatures survive) but the verdict is UNCHANGED. Log-only, so
# validators may enable it at their own pace; enforce is a later, separate
# coordinated decision once the shadow verdicts calibrate init_gate_tolerance.
init_gate_mode = "shadow"

