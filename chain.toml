[lane_b]
# Domain-expert lane (DEC-CA-0050), launched separately from lane A.
# 0 = off: no B pool is reserved. To launch B, announce an era start at/after
# [v2] from_block. A/B split 75/25 while C is off, A/B/C 50/25/25 while C is on.
# CONSENSUS: from_block, share, decay,
# TTL, remainder, domains, verdict params. Owner-tunable values marked.
from_block = 0
share     = 0.25                   # owner-tunable: B keeps 25% when C launches
remainder = "burn"                 # unpaid decay + empty domain slots burn
# The tsbench-forge domain labels (TSBench-Forge src/sources/sources.yaml,
# copied verbatim onto every pool window) — one emission slot each.
domains = ["econ_fin", "energy", "healthcare", "nature", "sales", "transport", "web_cloudops"]
# Payout schedule, counted in ERAS (era_settlements settlements): 100 % for
# a GAIN-TIERED full period, then halving every half_life_rounds eras to
# `floor`; payout STOPS at win_ttl_eras (merged weights stay in the king
# forever). Gain-tiered full-pay period (owner 2026-10-20, CONSENSUS,
# overlay-settable): full_pay_tiers = [[lcb_threshold, full_eras], ...],
# thresholds strictly descending in (0, 1), full_eras non-increasing and
# <= win_ttl_eras; a win pays in full for the full_eras of the HIGHEST
# threshold its target gain LCB meets (a multi-target leg: per target, each
# by its own LCB), fixed at the win and recorded on it (never re-evaluated).
# Below the lowest threshold (cannot happen while it is <= gain_margin) pays
# the lowest tier, flagged below_floor. UNCALIBRATED PLACEHOLDERS: lane-B
# domain LCBs are noisy (few windows / sources per domain) — set the
# thresholds from real win LCBs before arming.
full_pay_tiers   = [[0.05, 10], [0.02, 5], [0.01, 2]]   # owner-tunable
half_life_rounds = 1.0             # owner-tunable
floor            = 0.1             # owner-tunable
win_ttl_eras     = 28              # owner-tunable: 14 days of 12 h eras
# replay_settlements: unset ⇒ (win_ttl_eras + 1) × era_settlements, so a
# rebuilt validator's lane-B state holds every still-paying win.
# Verdict (gain = superiority, guards = non-inferiority, all at alpha)
alpha              = 0.05
bootstrap_B        = 10000
gain_margin        = 0.01          # > 0 (load-checked): an unchanged expert must not merge
tau_domain         = 0.01
tau_public         = 0.01
min_target_windows = 100
min_target_clusters = 5            # distinct sources among the target windows, else inconclusive
min_guard_windows  = 50
min_public_items   = 10
require_public     = ["gift", "boom", "time", "fev"]
# Trainer policy
open_tokens       = 200000000000   # 200B lineage tokens before lane B opens
routing_jaccard   = 0.7
routing_overlap   = 0.8
rebase_jaccard    = 0.5
rebase_overlap    = 0.7
esft_p            = 0.2
min_experts       = 8
max_experts       = 38
legs_per_domain   = 1
max_base_age_eras = 2
leg_hours         = 3.0
affinity_windows  = 256
# CONSENSUS merge guards (DEC-CA-0050 "state at merge"): from this era start
# validators refuse an era init whose lane-B merges overlap on any (layer,
# row) and any non-finite expert delta. "v2" = [v2] from_block (every lane-B
# era on mainnet); an integer is a typed era boundary; 0 = never.
merge_guard_from_block = "v2"
# Individual wins only qualify; payment starts after a passing incremental
# merge at a warm start. Activate with v2 on this not-yet-launched lane.
acceptance_from_block = "v2"
# Trainer policy (DEC-CA-0059 item 8): "miner" = lane-B legs rent on the
# miner's key via /v1/lane-b/fund (no operator fallback); "operator" = the
# retired operator lane pool (dev / emergency only).
leg_funding = "miner"


[lane_c]
# Fine-tuning lane (DEC-CA-0056). SHIPPED INERT: from_block = 0 (off). The
# owner types an ERA-BOUNDARY block at or after [v2] from_block; every
# validator must run the lane-C release before it (no readiness vote). The
# era starting at from_block is the first lane-C era; the settlement AT it is
# still a pre-lane-C receipt. CONSENSUS: share, takes_from, remainder,
# targets, payout schedule and verdict. Owner-tunable values marked.
# MarketCast-only lane C (owner 2026-10-20): lane C is a container for
# competitions, and a competition needs a FORWARD-ONLY eval. Today the only
# one is MarketCast (DEC-CA-0064, mkt:<suite>); the generic domain: / freq: /
# horizon: targets on the public-feed pool_c are refused at load (their
# windows could be scraped and memorised). Lane C has no pool of its own.
from_block = 0
share      = 0.25                  # owner-tunable: taken from lane A ⇒ A 50 / B 25 / C 25
takes_from = "lane_a"
remainder  = "burn"                # unpaid decay + empty target slots burn
# One emission slot each: "mkt:<suite>" for a [marketcast] suites member
# (the list must match it). Listed but inactive while [marketcast]
# from_block = 0: zero active slots, lane C's whole share burns.
targets = ["mkt:returns", "mkt:vol"]
# Payout schedule in ERAS (lane B's rule): 100 % for a GAIN-TIERED full
# period after the judging settlement, then halving every half_life_rounds
# eras to floor; payout STOPS at win_ttl_eras. full_pay_tiers (owner
# 2026-10-20, CONSENSUS, overlay-settable; same shape and checks as [lane_b]):
# the confirmed win's gain LCB picks the full_eras of the highest threshold it
# meets, fixed at the win. mkt: targets use [marketcast] full_pay_tiers.
# UNCALIBRATED PLACEHOLDERS — set from real lane-C win LCBs before arming.
# A confirmed win takes the slot only with a STRICTLY higher gain LCB than a
# holder on the same king (else the slot and its clock stay); a holder
# trained on an older king is replaced.
full_pay_tiers   = [[0.05, 10], [0.02, 5], [0.01, 2]]   # owner-tunable
half_life_rounds = 1.0             # owner-tunable
floor            = 0.1             # owner-tunable
win_ttl_eras     = 28              # owner-tunable: 14 days of 12 h eras
# Verdict: an mkt: entry is judged by MarketCast ([marketcast] alpha /
# gain_margin / min_windows ...), paired vs the pinned base on forward-only
# windows. The keys below are lane C's own verdict defaults, kept for the
# next registered forward-only competition (MarketCast does not read them).
alpha              = 0.05
bootstrap_B        = 10000
gain_margin        = 0.01          # owner-tunable
min_target_windows = 100
min_target_clusters = 5
n_windows          = 1000          # windows drawn per target per settlement
tau_public         = 0.01
min_public_items   = 10
# guard_public: none — public bench guards are refused on mkt: targets.
# Trainer policy (no consensus impact)
leg_hours          = 1.0
legs_per_target    = 2
max_base_age_eras  = 2
max_lr_scale       = 1.0           # recipe lr_scale in (0, max_lr_scale]
max_steps_fraction = 1.0           # recipe steps_fraction in (0, max_steps_fraction]

# Concurrent competitions (owner 2026-10-20, DEC-CA-0056). One table per
# configured competition; every [lane_c] target's kind needs one. CONSENSUS.
# Lane C's share is split by weight (normalised over EVERY configured
# competition, so one starting or ending never changes another's pay: an
# idle competition's part burns), then equally among its targets.
#   weight             >= 0                     (overlay-settable, DEC-CA-0057)
#   from_block         era boundary >= [lane_c] from_block; 0 = not started.
#                      MarketCast's start is [marketcast] from_block (one
#                      source of truth) — from_block is refused here for mkt.
#   until_block        era boundary after the start; 0 = no end (overlay-
#                      settable, never to or from a block already passed).
#                      The settlement AT it is the last judged; after it no
#                      entry is admitted, dispatched or judged.
#   wind_down          "finish_full_pay" (default): a win held at the end keeps
#                      100 % while inside its own tiered full-pay period AND
#                      within wind_down_max_eras eras of the end, then stops
#                      (no decay tail); "stop": pay stops at the end.
#   wind_down_max_eras default 6
# Adding a competition kind is a release (its eval is code); see docs/OPERATOR.md.
[lane_c.competitions.mkt]
weight             = 1.0
until_block        = 0             # no end
wind_down          = "finish_full_pay"
wind_down_max_eras = 6


# CPU generation tier (DEC-CA-0053; operator-side, never in contract_digest).
# It serves exactly the legs whose effective contract has corpus_mode =
# "shards" — on mainnet that is [v2.training], so it goes live with v2.
[generation]
enabled            = true          # allowed; it runs only for legs whose contract is "shards"
                                   # ([v2.training] from [v2] from_block), so inert until v2
providers          = ["targon", "shadeform"]   # preference order; Lium has no CPU VMs
vcpus              = 32            # the pinned per-leg shape (owner pays; Targon CPU XLarge $1.00/h)
child_memory_mb    = 2048
children           = 0             # 0 = one sandbox child per vCPU
max_parallel_jobs  = 2             # shared CPU VM cap; additional corpora wait
max_price_per_hour = 1.25
window_seconds     = 5400          # 90-minute generation window; CPU budget = vcpus x this
target_points      = 50_000_000_000
shard_points       = 16_777_216      # ~64 MB float32; a streaming pod holds ~2 per child
max_length         = 32768
storage_prefix     = "corpora/"
bucket             = ""            # "" = [storage] manifest_bucket (private; kings get public-read)
vm_image           = ""            # provider VM image (Targon: set before go-live)
retention_days     = 14            # non-king corpora are deleted after this
king_publish       = "recipe"      # "full" | "recipe" (ref + seed + digest + sample shards)
sample_shards      = 4

[netconfig]
network_id = "bittensor:finney"
# Owner-signed network config (DEC-CA-0057). The ONE hotkey whose signed
# overlay (config/network/seq-<n>.json + latest.json in the manifest bucket)
# validators adopt: the owner's MAIN validator hotkey (the same key that signs
# the results satellites replay, DEC-CA-0058). An overlay may change only
# [scoring], [eval], the [round] schedule keys, [v2] runtime policy,
# [lane_b], [lane_c] and listed numeric [marketcast] controls; adopted by the tally (a
# `cfg-<8 hex>` note segment, 51 % of permit stake) and applies at its
# era-start effective_block (or the first era start after a late lock-in).
# "" = completely inert: nothing fetched, signalled or applied.
owner_hotkey = "5FcCsoB2R5M55RdrNrvPQv7xmLJRFzs7R7C73UUSxgUCyfsw"  # main validator: benchmark and policy signer
poll_seconds = 300                 # how often latest.json is re-read

[satellite]
# Satellite validators (DEC-CA-0058, `cascade-satellite`): replay the main
# validator's ([netconfig] owner_hotkey) signed receipts and set the vector
# that replay derives — no model, no pool, no torch. Read only by satellites.
# When the main validator is silent a satellite re-asserts its last verified
# vector until stale_after_blocks past that settlement's boundary, then burns
# until a new receipt verifies.
stale_after_blocks = 3600          # one era
poll_seconds       = 60            # how often the main validator's receipts are re-read
max_walk           = 64            # receipts walked back per poll to reach the last replayed one

