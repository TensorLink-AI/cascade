# Decided on-chain votes and the live worker-image pins — the drift-guard record.
#
# Stake-weighted activation (DEC-CA-0045) lets the fleet decide a feature's
# block on chain. Once decided and applied, the block is TYPED into the release
# chain.toml: behaviour-identical, and it frees the feature's segment of the
# 128-byte readiness note. This file records what the fleet decided so that
# `tests/unit/test_decided_votes.py` (CI) and `cascade-audit decided` (the box)
# can tell when chain.toml has not caught up. See cascade/shared/decided.py.
#
# Maintenance, every time a vote locks in (the validator logs "DECIDED: …"):
#   1. add or update the [[vote]] row (feature, lock_block, activation_block, source);
#   2. once activation_block has passed, type the block in chain.toml (the row's
#      key, from decided.TYPED_KEY_BY_PREFIX) in the same PR;
#   3. bump as_of_block to the boundary you are at.
# A row with type_it = false is HELD: the guard reports it and never asks to
# type it; `reason` says why (nodes disagree, or an owner decision is pending).
#
# Pins: the image digests the network trains on. Moving one in chain.toml
# without updating this file (or vice versa) fails CI.

as_of_block = 9494100   # Fri 13 Nov 2026 01:23 UTC settlement (the last boundary passed when written)

