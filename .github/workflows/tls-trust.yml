name: TLS trust regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ca-certificates
      - name: Verify the bootstrap OS trust store without bundled packages
        run: python -S scripts/check_tls_trust.py
      - name: Refresh installers and independently bundled certificates
        run: python -m pip --cert /etc/ssl/certs/ca-certificates.crt install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
      - run: python scripts/check_tls_trust.py
