name: king-sync

# Archives the subnet's current best generator (the king) into
# champions/king/ — one commit per reign, scan-gated, provenance-stamped —
# and every lane B slot winner into champions/lane_b/ (the hashed
# champions/lane_b/index.json the trainer publishes).
#
# Every run: resolve the king by the TRAINER's rule — the anchor validator's
# latest signed receipt ([manifest] validator_hotkey; signature verified),
# verdict.king_hotkey of a scored round (named the moment a dethrone is
# scored), never a forfeited hotkey, code ref from that receipt's signed
# manifest; an unusable receipt keeps the archived king → fetch its exact
# code by digest →
# static security scan (scripts/scan_generator.py; high-severity findings
# REFUSE the archive) → commit + push only when the digest changed. A quiet
# run is a no-op (~40 s), so the 15-minute schedule costs little between
# dethrones and a new king lands here within ~15 min of its public ZIP.
# `git log champions/king` is the subnet's reign timeline, each snapshot
# independently verifiable against the on-chain commitment.
#
# The fetch is read-only (public chain RPC + anonymous artifact pull) and
# needs no secrets; the push back uses GITHUB_TOKEN.
#
# GitHub silently disables cron workflows on repos with 60 idle days —
# if syncs go quiet for weeks, check the schedule is still enabled
# (workflow_dispatch re-runs it by hand).

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      allow_findings:
        description: "Archive even with high-severity scan findings"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: king-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fetch needs only the chain + storage halves — no torch, no train stack
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"

      - name: Install CLI deps
        run: |
          python scripts/check_tls_trust.py --system-only
          uv pip install --system --python "$(which python)" "pip==26.2.2" -e ".[chain,hippius]" numpy
          python scripts/check_tls_trust.py

      - name: Sync the king
        run: |
          python scripts/sync_king.py --python "$(which python)" \
            ${{ inputs.allow_findings && '--allow-findings' || '' }}

      # Lane B slot winners (owner 2026-11-27): the generators whose experts
      # were merged into the king, published by the trainer's champion step
      # (champions/lane_b/index.json, public-read) — same scan gate, same
      # provenance, same push. Runs even when the lane A sync failed.
      - name: Sync the lane B slot champions
        if: ${{ !cancelled() }}
        run: |
          python scripts/sync_lane_b_champions.py \
            ${{ inputs.allow_findings && '--allow-findings' || '' }}

      - name: Push the reign commit (if any)
        if: ${{ !cancelled() }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse '@{u}')" ]; then
            git push
            echo "pushed a new reign commit"
          else
            echo "king unchanged — nothing pushed"
          fi
