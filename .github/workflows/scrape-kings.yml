# Snapshot cascade generators into the private R2 archive — kings AND everyone.
#
# Reads the validator's public throne history (receipts/index.json in the
# manifest bucket) and saves generator code — fetched from the Hippius Hub,
# packed to a deterministic tar — to the PRIVATE R2 [storage]
# king_archive_bucket in two dirs: kings/ (every throne-holder, with a
# kings/index.json "db") and generators/<hotkey>/ (EVERY eligible participant,
# grouped by committing miner, gathered from each round's full signed receipt,
# with generators/index.json). See
# scripts/scrape_kings.py and cascade.shared.king_archive.
#
# The archive is content-addressed + append-only: a generator already in the
# bucket is never re-fetched, only its metadata is refreshed, and already-scanned
# round receipts are never re-read. Safe to run often.
#
# REQUIRED repo secrets:
#   CASCADE_S3_ACCESS_KEY / CASCADE_S3_SECRET_KEY   read the manifest bucket
#     (receipts/index.json); aliased into HIPPIUS_S3_* below.
#   BACKUP_S3_ACCESS_KEY / BACKUP_S3_SECRET_KEY     WRITE the R2 king archive
#     (the same R2 account chain.toml already uses for the manifest backup). The
#     scraper falls back to this pair when KING_ARCHIVE_S3_* is unset.
#   HIPPIUS_HUB_TOKEN                               pull PRIVATE Hub repos.
#     Anonymous pull covers public repos only, and while king generators are
#     public by design, the generators/ sweep archives EVERY participant ref
#     from the round receipts — and miners do commit private Hub repos (e.g.
#     cascade-private/*). Without the token every private ref is unfetchable.
#   HF_TOKEN (optional)                             same, for private `@hf:` refs.
#
# A RED run means something retryable broke (the Hub was down, R2 creds expired)
# — act on it. Generators the miner has since DELETED or made private are not a
# failure and do not fail the job: they can never be fetched again, so the
# scraper records them in generators/index.json under `unavailable`, stops
# retrying after a few runs, and prints a note on an otherwise green run. Re-run
# via workflow_dispatch with retry_unavailable to give those refs another go
# (e.g. after widening HIPPIUS_HUB_TOKEN, or when a miner republishes).
#
# Use ONE scraper only — two concurrent runs would race on the index.json dbs
# (the concurrency group below already serialises this workflow's own runs).
name: Scrape kings

on:
  schedule:
    - cron: "40 4 * * *"          # 04:40 UTC daily — after the day's round settles
  workflow_dispatch:
    inputs:
      network:
        description: "Which chain config to read"
        type: choice
        options: [mainnet, testnet]
        default: mainnet
      dry_run:
        description: "List what would be archived without writing anything"
        type: boolean
        default: false
      retry_unavailable:
        description: "Re-try generators parked as deleted/private upstream"
        type: boolean
        default: false

concurrency:
  group: scrape-kings            # never let two runs race on kings/index.json
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Manifest-bucket read key, aliased into the HIPPIUS_S3_* the scraper reads.
      HIPPIUS_S3_ACCESS_KEY: ${{ secrets.CASCADE_S3_ACCESS_KEY }}
      HIPPIUS_S3_SECRET_KEY: ${{ secrets.CASCADE_S3_SECRET_KEY }}
      # R2 king-archive WRITE key (scraper falls back to BACKUP_S3_* when
      # KING_ARCHIVE_S3_* is unset).
      BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      # Hub pull auth: public repos pull anonymously, but participant refs can
      # point at PRIVATE Hub repos (and private `@hf:` refs) — those need a token.
      HIPPIUS_HUB_TOKEN: ${{ secrets.HIPPIUS_HUB_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cascade (hippius extra)
        run: pip install -e ".[hippius]"

      - name: Scrape kings → private R2 archive
        env:
          NETWORK: ${{ github.event.inputs.network || 'mainnet' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          RETRY_UNAVAILABLE: ${{ github.event.inputs.retry_unavailable || 'false' }}
        run: |
          if [ -z "$BACKUP_S3_ACCESS_KEY" ]; then
            echo "::error::BACKUP_S3_ACCESS_KEY not set — cannot write the R2 king archive."
            exit 1
          fi
          if [ -z "$HIPPIUS_HUB_TOKEN" ]; then
            echo "::warning::HIPPIUS_HUB_TOKEN not set — anonymous pull covers public repos only; private generator repos will fail to snapshot."
          fi
          TOML=chain.toml
          [ "$NETWORK" = "testnet" ] && TOML=chain.testnet.toml
          FLAGS=""
          [ "$DRY_RUN" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "$RETRY_UNAVAILABLE" = "true" ] && FLAGS="$FLAGS --retry-unavailable"
          echo "scraping kings + generator snapshots with $TOML $FLAGS"
          python scripts/scrape_kings.py --chain-toml "$TOML" $FLAGS
