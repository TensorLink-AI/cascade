# Test + lint gate on every PR and push to main or cascade-v2 — the repo's FIRST automated
# test CI. Added after a mainnet chain.toml change (commit_floor_block) silently
# broke ~23 round tests with nothing to catch it. Ruff is scoped to cascade/ +
# tests/; the vendored base_generator/, benchmarks/, and scripts/ carry separate
# pre-existing lint debt (out of scope for this gate).
name: CI

on:
  pull_request:
  push:
    branches: [main, cascade-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated TLS trust for the CI job
        run: python3 scripts/prepare_ci_tls.py "$RUNNER_TEMP/cascade-ca" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Check system TLS trust before Git dependency fetches
        run: uv run --no-project --python 3.11 python scripts/check_tls_trust.py --system-only

      # --frozen: install exactly the pinned lock (the reproducibility contract);
      # --all-extras pulls torch so the full suite runs (torch tests otherwise skip).
      - name: Sync (frozen, all extras)
        run: uv sync --frozen --all-extras

      - name: Check TLS trust
        run: uv run --frozen python scripts/check_tls_trust.py

      - name: Lint (ruff — cascade + tests)
        run: uv run ruff check cascade tests

      - name: Documentation interfaces and links
        run: uv run python scripts/check_docs.py

      - name: Unit tests
        run: uv run --frozen pytest tests/unit -q --maxfail=1
