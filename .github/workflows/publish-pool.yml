# Daily publish of the cascade held-out eval pool from the tsbench-forge mirror.
#
# The two-bucket relay (docs/EVAL_POOL.md): the forge scrape host mirrors raw
# data to a PRIVATE forge bucket; this job syncs that down and builds + publishes
# a dated eval-pool snapshot to [storage] pool_bucket. Validators then pull the
# rotating pool by effective_block — no chain.toml edit per round.
#
# TWO scoped keys, one per bucket:
#   * FORGE READ  (TSFORGE_S3_*)  — reads the forge bucket; used by the aws s3
#     sync step (as AWS_*).
#   * CASCADE     (CASCADE_S3_*)  — writes the eval-pool bucket + reads the
#     manifest bucket; aliased into HIPPIUS_S3_* for cascade-pool publish.
# Each key is applied only to its own step, so neither is exposed to the other's
# bucket.
#
# REQUIRED repo secrets:
#   TSFORGE_S3_ACCESS_KEY / TSFORGE_S3_SECRET_KEY   read on forge bucket
#   CASCADE_S3_ACCESS_KEY / CASCADE_S3_SECRET_KEY   write eval-pool + read manifest
# OPTIONAL (enables the public HF reveal):
#   HF_TOKEN                                        HF write token for HF_EVAL_REPO's org
#   (repo var HF_EVAL_REPO, default Tensor-Link/cascade-eval-pool) — RETIRED
#   snapshot tars are mirrored here byte-identically (sha256-verified against
#   pool/index.json, the same hash round receipts pin). Only snapshots already
#   superseded by a newer active one are revealed (~48h lag), so a revealed
#   pool can never be selected by a current or future round. Unset HF_TOKEN =>
#   the reveal step is skipped and only the private publish runs.
# OPTIONAL repo variables:
#   TSFORGE_BUCKET        forge raw-data bucket   (default: tsbench-forge-sources)
#   HIPPIUS_S3_ENDPOINT   S3 endpoint             (default: https://s3.hippius.com)
#
# PREREQUISITE: `--effective-block auto` reads the trainer's latest.json from the
# manifest bucket — that needs this key to also read cascade-manifests AND a live
# trainer. If either is missing, dispatch with an explicit effective_block.
#
# Use ONE publisher only — if another host already publishes to the pool bucket,
# retire it before enabling the schedule (two publishers race on pool/index.json).
name: Publish eval pool

on:
  schedule:
    - cron: "0 3 * * *"          # 03:00 UTC daily — active from the next round
  workflow_dispatch:
    inputs:
      network:
        description: "Which chain config to publish"
        type: choice
        options: [mainnet, testnet]
        default: mainnet
      effective_block:
        # Default is an INERT sentinel: 999999999999 is far beyond any real epoch
        # block, so validators (which pick the greatest effective_block <= the
        # round block) can never select it — safe for smoke-testing the relay
        # without publishing a live snapshot. Set a real future epoch block for a
        # production publish, or 'auto' once a trainer manifest exists.
        description: "effective_block: 999999999999 = inert test snapshot; a real future epoch block for production; 'auto' needs a trainer manifest"
        required: false
        default: "999999999999"

concurrency:
  group: publish-pool          # never let two publishes race on pool/index.json
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # forge-mirror sync crossed the old 60m wall on 2026-08-18 (fresh runner re-syncs the whole growing bucket daily; last success 52m57s) and every run since died mid-sync — reveals stalled 6 days. 120 unblocks; the structural fix is caching/scoping the sync.
    env:
      # CASCADE key — writes the eval-pool bucket (and reads the manifest bucket
      # for --effective-block auto). cascade-pool publish reads HIPPIUS_S3_*, so
      # the dedicated cascade key is aliased into it. The forge-read key is
      # applied separately, per-step, to the sync below.
      HIPPIUS_S3_ACCESS_KEY: ${{ secrets.CASCADE_S3_ACCESS_KEY }}
      HIPPIUS_S3_SECRET_KEY: ${{ secrets.CASCADE_S3_SECRET_KEY }}
      TSFORGE_BUCKET: ${{ vars.TSFORGE_BUCKET || 'tsbench-forge-sources' }}
      S3_ENDPOINT: ${{ vars.HIPPIUS_S3_ENDPOINT || 'https://s3.hippius.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # awscli is deliberately NOT pip-installed here. The ubuntu-latest runner
      # ships AWS CLI v2 pre-installed (used by the sync step below), and pulling
      # pip's awscli (v1, which EXACT-pins botocore) into the same resolve as the
      # hippius extra's boto3>=1.34 sent pip's resolver into a long backtracking
      # storm over botocore versions — the install stalled until the job hit
      # "The operation was canceled". Rely on the pre-installed v2 instead.
      - name: Install cascade (pool-forge + hippius extras)
        run: pip install -e ".[pool-forge,hippius]"

      # The forge mirror is date-partitioned parquet (<feed>/<date>.parquet,
      # immutable once written), but the runner is ephemeral — without a cache
      # every run re-downloads the ENTIRE bucket (2026-08-24: 63,183 files,
      # 85 minutes, latency-bound on small objects; this is what killed the job
      # daily at the old 60m wall from 2026-08-18). Restoring yesterday's
      # mirror turns the sync into a delta pull of just the new partitions.
      # Key is per-run so the post-job save always stores the updated mirror;
      # restore-keys falls back to the newest prior save. FAIL-OPEN: a cache
      # miss (eviction, first run) or a failed save (mirror outgrows the repo's
      # 10 GB cache quota) degrades to today's full sync under the 120m wall —
      # the sync step itself is unchanged and remains the source of truth.
      - name: Restore forge mirror cache
        uses: actions/cache@v4
        with:
          path: ./tsforge
          key: tsforge-mirror-${{ github.run_id }}
          restore-keys: |
            tsforge-mirror-

      - name: Sync forge mirror down  (FORGE READ key only)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TSFORGE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TSFORGE_S3_SECRET_KEY }}
        run: |
          aws --version   # pre-installed AWS CLI v2; fail loudly if the image drops it
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::TSFORGE_S3_ACCESS_KEY not set — cannot read the forge bucket."
            exit 1
          fi
          aws s3 sync "s3://${TSFORGE_BUCKET}" ./tsforge \
            --endpoint-url "$S3_ENDPOINT" --exact-timestamps
          n=$(find ./tsforge/data -name '*.parquet' 2>/dev/null | wc -l)
          newest=$(ls -1 ./tsforge/data/*/*.parquet 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)
          echo "synced $n parquet files; newest partition: ${newest:-none}"
          # mirror size, for watching growth against the 10 GB cache quota
          du -sh ./tsforge || true
          test "$n" -gt 0 || { echo "::error::forge mirror is empty"; exit 1; }

      - name: Build + publish snapshot  (CASCADE key)
        env:
          NETWORK: ${{ github.event.inputs.network || 'mainnet' }}
          EFFECTIVE_BLOCK: ${{ github.event.inputs.effective_block || 'auto' }}
          # R2 dual-write of the pool snapshot + index ([storage]
          # pool_backup_bucket). Scoped to this step like the other keys.
          # Unset secrets => empty env => backup cleanly disabled (logged),
          # so this is safe to merge before the repo secrets exist.
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        run: |
          TOML=chain.toml
          [ "$NETWORK" = "testnet" ] && TOML=chain.testnet.toml
          echo "publishing with $TOML (effective-block=$EFFECTIVE_BLOCK)"
          # SERIES CAPS (publish only — the reveal below mirrors the published
          # tar byte-for-byte and builds nothing, so no flag parity is needed).
          # --max-panel-series-per-feed 25: each GBFS bike-share feed panel-expands
          #   into ~200 station series (8 feeds put transport at ~73% of the pool);
          #   25 per feed keeps the signal without the flood.
          # --max-series-per-domain-freq 300: balance by domain AND granularity —
          #   no (domain, freq) cell can dominate, so an hourly flood inside a
          #   domain can't crowd out that domain's daily series either.
          # --max-series-per-domain 600: outer bound — every domain is already
          #   multi-granularity (4-9 freqs), so the cell cap alone would let one
          #   domain span cells up to 300 x n_freqs; 600 absolute caps that.
          #   Binds nothing in today's pool (largest post-cap domain ~367).
          TSFORGE_DIR=./tsforge cascade-pool publish \
            --chain-toml "$TOML" \
            --sources tsbench_forge \
            --max-panel-series-per-feed 25 \
            --max-series-per-domain-freq 300 \
            --max-series-per-domain 600 \
            --effective-block "$EFFECTIVE_BLOCK"

      # Public reveal: mirror RETIRED snapshot tars from the pool bucket to a
      # public HF dataset — the EXACT bytes validators scored, sha256-verified
      # against pool/index.json (the hash round receipts pin). Nothing is
      # rebuilt: the old rebuild-based reveal drifted from the pinned tar
      # whenever mirror partitions landed after the publish (observed live:
      # block-8740800 = 3,356 series vs its rebuild = 3,442). The newest two
      # snapshots are withheld (pending + possibly-active), so a revealed pool
      # can never be selected by a current or future round; effective lag ~48h.
      # Idempotent per snapshot — backlog backfills across runs (max 6/run).
      # Skipped cleanly if HF_TOKEN isn't set.
      - name: Reveal retired snapshots to public HF  (exact bytes)
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_EVAL_REPO: ${{ vars.HF_EVAL_REPO || 'Tensor-Link/cascade-eval-pool' }}
          NETWORK: ${{ github.event.inputs.network || 'mainnet' }}
        run: |
          TOML=chain.toml
          [ "$NETWORK" = "testnet" ] && TOML=chain.testnet.toml
          cascade-pool reveal --chain-toml "$TOML" --hf-repo "$HF_EVAL_REPO"
