# Lane D W1 measurement (docs/plans/LANE_D_PLAN.md, W1 row) — CI-only
# orchestration, owner-directed 2026-11-23: no box has forge access, so the
# W1 evidence run happens here, with the repo's EXISTING read secrets.
#
# READ-ONLY. Nothing in this job writes to any bucket:
#   * the pool snapshots are fetched with get_* calls only (read_pool_index +
#     get_bytes + head_object) and verified against pool/index.json's sha256;
#   * the forge mirror is synced DOWN (bucket -> runner) and its cache is
#     RESTORED only (actions/cache/restore — never saved, so this job cannot
#     evict publish-pool's mirror cache).
#
# Secrets (the same names publish-pool.yml uses; none new):
#   POOL_S3_ACCESS_KEY / POOL_S3_SECRET_KEY         eval-pool bucket (preferred)
#   CASCADE_S3_ACCESS_KEY / CASCADE_S3_SECRET_KEY   fallback when no POOL pair
#   TSFORGE_S3_ACCESS_KEY / TSFORGE_S3_SECRET_KEY   forge bucket read (sync step only)
# Repo variables: TSFORGE_BUCKET (default tsbench-forge-sources),
#   HIPPIUS_S3_ENDPOINT (default https://s3.hippius.com).
#
# Output: artifact `laned-w1-<run_id>` (w1.json, w1_summary.txt, the pool
# index copy, forge_inventory.txt), retained 14 days. Manual dispatch only.
name: Lane D W1 measure

on:
  workflow_dispatch:
    inputs:
      snapshots:
        description: "Number of most recent pool snapshots to diff (>= 2)"
        required: false
        default: "7"
      margin_hours:
        description: "Forward-eligibility margin in hours (rev6.10: 6)"
        required: false
        default: "6"
      sync_forge:
        description: "Also sync the forge mirror down and record its inventory"
        type: boolean
        default: true

concurrency:
  group: laned-w1-measure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      N_SNAPSHOTS: ${{ github.event.inputs.snapshots || '7' }}
      MARGIN_HOURS: ${{ github.event.inputs.margin_hours || '6' }}
      TSFORGE_BUCKET: ${{ vars.TSFORGE_BUCKET || 'tsbench-forge-sources' }}
      S3_ENDPOINT: ${{ vars.HIPPIUS_S3_ENDPOINT || 'https://s3.hippius.com' }}
      OUT_DIR: ${{ github.workspace }}/w1-out
      SNAPS_DIR: ${{ github.workspace }}/w1-snapshots
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated TLS trust for the CI job
        run: python3 scripts/prepare_ci_tls.py "$RUNNER_TEMP/cascade-ca" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          enable-cache: true

      # pool-forge (pyarrow/pyyaml/pandas, already in uv.lock) is what the
      # forge-mirror measurement reads parquet with; still no torch.
      - name: Sync (frozen; hippius + pool-forge extras — no torch)
        run: uv sync --frozen --extra hippius --extra pool-forge

      - name: Validate inputs
        run: |
          case "$N_SNAPSHOTS" in ''|*[!0-9]*) echo "::error::snapshots must be an integer"; exit 1;; esac
          if [ "$N_SNAPSHOTS" -lt 2 ] || [ "$N_SNAPSHOTS" -gt 30 ]; then
            echo "::error::snapshots must be in [2, 30]"; exit 1
          fi
          python3 -c "import sys; v=float(sys.argv[1]); sys.exit(0 if 0 <= v <= 240 else 1)" "$MARGIN_HOURS" \
            || { echo "::error::margin_hours must be a number in [0, 240]"; exit 1; }
          mkdir -p "$OUT_DIR" "$SNAPS_DIR"

      # Read-only fetch of the N newest real snapshots (inert smoke-test
      # sentinels >= 999999999999 skipped). Each tar is sha256-verified against
      # the index (fetch_pool_snapshot) and unpacked to SNAPS_DIR/<effective_block>,
      # the name laned_w1_measure.py matches against --index. Build time = the
      # tar's S3 LastModified when the primary store answers head_object
      # (publish time, ~minutes after build), else the index as_of DATE.
      - name: Fetch + unpack recent pool snapshots  (pool READ key only)
        env:
          POOL_S3_ACCESS_KEY: ${{ secrets.POOL_S3_ACCESS_KEY }}
          POOL_S3_SECRET_KEY: ${{ secrets.POOL_S3_SECRET_KEY }}
          HIPPIUS_S3_ACCESS_KEY: ${{ secrets.CASCADE_S3_ACCESS_KEY }}
          HIPPIUS_S3_SECRET_KEY: ${{ secrets.CASCADE_S3_SECRET_KEY }}
        run: |
          if [ -z "$POOL_S3_ACCESS_KEY" ] && [ -z "$HIPPIUS_S3_ACCESS_KEY" ]; then
            echo "::error::neither POOL_S3_ACCESS_KEY nor CASCADE_S3_ACCESS_KEY is set"
            exit 1
          fi
          uv run --frozen python -P -c '
          import json, os, sys
          from pathlib import Path
          from cascade.shared.config import load_chain_config
          from cascade.shared.hippius import (
              fetch_pool_snapshot, pool_index_key, pool_s3_store, read_pool_index)

          n = int(os.environ["N_SNAPSHOTS"])
          out, snaps = Path(os.environ["OUT_DIR"]), Path(os.environ["SNAPS_DIR"])
          cfg = load_chain_config("chain.toml")
          store = pool_s3_store(cfg.storage)
          (out / "index.json").write_text(store.get_text(pool_index_key()), encoding="utf-8")
          index = [m for m in read_pool_index(store) if m.effective_block < 999999999999]
          chosen = index[-n:]
          if len(chosen) < 2:
              sys.exit(f"pool index has {len(chosen)} real snapshot(s); need >= 2")
          primary = getattr(store, "primary", store)
          bt = []
          for m in chosen:
              fetch_pool_snapshot(store, m, snaps / str(m.effective_block))
              when = None
              try:
                  head = primary.client().head_object(Bucket=primary.cfg.bucket, Key=m.key)
                  when = head["LastModified"].strftime("%Y-%m-%dT%H:%M:%SZ")
              except Exception as e:
                  print(f"block-{m.effective_block}: no LastModified ({type(e).__name__}); "
                        "using index as_of (day granularity)")
              if when:
                  bt.append(f"{m.effective_block}={when}")
              shown = when or "index as_of"
              print(f"block-{m.effective_block}: as_of={m.as_of} n_series={m.n_series} "
                    f"build_time={shown} sha256={m.sha256[:16]}")
          (out / "build_times.txt").write_text("".join(s + "\n" for s in bt), encoding="utf-8")
          '

      - name: Run W1 measurement (snapshot-diff bound)
        run: |
          args=""
          while IFS= read -r line; do
            [ -n "$line" ] && args="$args --build-time $line"
          done < "$OUT_DIR/build_times.txt"
          # shellcheck disable=SC2086  # args is a list of NAME=ISO tokens, no spaces
          uv run --frozen python -P scripts/laned_w1_measure.py \
            --snapshots-dir "$SNAPS_DIR" \
            --index "$OUT_DIR/index.json" \
            --margin-hours "$MARGIN_HOURS" \
            $args \
            --out "$OUT_DIR/w1.json" | tee "$OUT_DIR/w1_summary.txt"

      # Forge mirror, read-only: synced down, inventoried, then measured by the
      # step after the sync (laned_w1_measure.py --forge-dir, "measured from
      # forge mirror"). Restore-only cache: never saved from this job.
      - name: Restore forge mirror cache  (restore only)
        if: github.event.inputs.sync_forge != 'false'
        uses: actions/cache/restore@v4
        with:
          path: ./tsforge
          key: tsforge-mirror-${{ github.run_id }}
          restore-keys: |
            tsforge-mirror-

      - name: Sync forge mirror down  (FORGE READ key only)
        id: forge_sync
        if: github.event.inputs.sync_forge != 'false'
        continue-on-error: true
        timeout-minutes: 120
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TSFORGE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TSFORGE_S3_SECRET_KEY }}
          AWS_MAX_ATTEMPTS: "10"
          AWS_RETRY_MODE: adaptive
        run: |
          aws --version
          aws configure set default.s3.max_concurrent_requests 64
          aws configure set default.s3.max_queue_size 20000
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::error::TSFORGE_S3_ACCESS_KEY not set — cannot read the forge bucket."
            exit 1
          fi
          ok=""
          for pass in 1 2 3; do
            if aws s3 sync "s3://${TSFORGE_BUCKET}" ./tsforge \
                 --endpoint-url "$S3_ENDPOINT" --only-show-errors; then
              ok=1; break
            fi
            echo "::warning::forge sync pass $pass failed; retrying the remainder"
            sleep 30
          done
          test -n "$ok" || { echo "::error::forge sync failed after 3 passes"; exit 1; }
          {
            echo "forge bucket: ${TSFORGE_BUCKET}"
            echo "parquet files: $(find ./tsforge -name '*.parquet' 2>/dev/null | wc -l)"
            echo "newest partition: $(find ./tsforge -name '*.parquet' 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)"
            echo "size: $(du -sh ./tsforge | cut -f1)"
            echo "parquet files per top-level feed dir (top 50):"
            find ./tsforge -name '*.parquet' 2>/dev/null | awk -F/ '{print $3"/"$4}' | sort | uniq -c | sort -rn | head -50
          } | tee "$OUT_DIR/forge_inventory.txt"

      # Re-runs the (deterministic) snapshot-diff bound together with the
      # forge-mirror measurement, so w1.json carries both blocks. Runs only
      # when the sync above really succeeded (its continue-on-error keeps the
      # job green otherwise, and w1.json stays the snapshot-only one).
      - name: Run W1 measurement (+ forge mirror, measured)
        if: steps.forge_sync.outcome == 'success'
        run: |
          args=""
          while IFS= read -r line; do
            [ -n "$line" ] && args="$args --build-time $line"
          done < "$OUT_DIR/build_times.txt"
          # shellcheck disable=SC2086  # args is a list of NAME=ISO tokens, no spaces
          uv run --frozen python -P scripts/laned_w1_measure.py \
            --snapshots-dir "$SNAPS_DIR" \
            --index "$OUT_DIR/index.json" \
            --margin-hours "$MARGIN_HOURS" \
            $args \
            --forge-dir ./tsforge --embargo-hours 48 \
            --out "$OUT_DIR/w1.json" | tee "$OUT_DIR/w1_summary.txt"

      - name: Upload W1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laned-w1-${{ github.run_id }}
          path: w1-out/
          retention-days: 14
          if-no-files-found: warn
