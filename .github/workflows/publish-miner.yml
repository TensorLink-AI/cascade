name: cascade-miner image

# Keeps ghcr.io/<owner>/cascade-miner FRESH: every change that lands in the image
# rebuilds it, each build is smoke-tested BEFORE anything is pushed, and a broken
# build never reaches a tag miners pull.
#
#   tag                         target    moves when
#   :latest / :oneclick         both      every main push that touches the image,
#                                         a new archived king, the weekly refresh
#   :sha-<short>[-oneclick]     both      every published build (immutable; pin this)
#   :v<X>[-oneclick]            both      a `miner-v<X>` git tag (release)
#
# Triggers:
#   push to main (image paths)  → build, smoke, publish :latest/:oneclick
#   pull_request (image paths)  → build + smoke only, never pushes
#   king-sync completed         → rebuild only if champions/king actually changed
#                                 (king-sync pushes with GITHUB_TOKEN, which never
#                                 triggers `push` workflows; workflow_run is the
#                                 documented exception)
#   weekly schedule             → fresh CUDA base, apt security fixes, Claude Code
#   miner-v* tag / manual       → versioned release / on-demand rebuild
#
# Miner-side only: nothing downstream pins this image; it is not part of the
# training contract (that is cascade-worker, publish-worker.yml).

on:
  push:
    branches: [main]
    tags: ["miner-v*"]
    paths:
      - "cascade/**"
      - "champions/king/**"
      - "scripts/example_generator/**"
      - "scripts/example_strategy.py"
      - ".claude/skills/cascade-mine/**"
      - "deploy/miner.Dockerfile"
      - "deploy/miner-entrypoint.sh"
      - "deploy/miner-smoke.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "chain.toml"
      - "chain.testnet.toml"
      - ".dockerignore"
      - ".github/workflows/publish-miner.yml"
  pull_request:
    paths:
      - "cascade/**"
      - "champions/king/**"
      - "scripts/example_generator/**"
      - "scripts/example_strategy.py"
      - ".claude/skills/cascade-mine/**"
      - "deploy/miner.Dockerfile"
      - "deploy/miner-entrypoint.sh"
      - "deploy/miner-smoke.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "chain.toml"
      - "chain.testnet.toml"
      - ".dockerignore"
      - ".github/workflows/publish-miner.yml"
  workflow_run:
    workflows: ["king-sync"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"          # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the result (otherwise build + smoke only)"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  # One build per ref; a newer push supersedes a queued/running one.
  group: miner-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      push: ${{ steps.decide.outputs.push }}
      ref: ${{ steps.decide.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_PUSH: ${{ inputs.push }}
        run: |
          build=true; push=false; ref="$(git rev-parse HEAD)"
          case "$EVENT" in
            pull_request) push=false ;;
            push|schedule) push=true ;;
            workflow_dispatch) push="${DISPATCH_PUSH:-true}" ;;
            workflow_run)
              # king-sync runs every 15 min and mostly changes nothing: rebuild
              # only when it actually committed a new champions/king.
              if [ "$RUN_CONCLUSION" != "success" ] \
                 || git diff --quiet "$RUN_HEAD" HEAD -- champions/king; then
                build=false
              else
                push=true
              fi ;;
          esac
          echo "build=$build push=$push ref=$ref ($EVENT $REF)"
          { echo "build=$build"; echo "push=$push"; echo "ref=$ref"; } >> "$GITHUB_OUTPUT"

  image:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: toolbox
            suffix: ""
            floating: latest
          - target: oneclick
            suffix: "-oneclick"
            floating: oneclick
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.ref }}

      # The CUDA + torch stack does not fit the runner's default free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.gate.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ needs.gate.outputs.ref }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          S: ${{ matrix.suffix }}
          FLOAT: ${{ matrix.floating }}
        run: |
          img="ghcr.io/${OWNER,,}/cascade-miner"
          tags="$img:sha-${SHA::7}$S"
          case "$REF" in
            refs/tags/miner-v*) tags="$tags,$img:v${REF#refs/tags/miner-v}$S" ;;
            *) [ "$EVENT" != pull_request ] && tags="$tags,$img:$FLOAT" ;;
          esac
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "local=cascade-miner-ci:${{ matrix.target }}" >> "$GITHUB_OUTPUT"
          echo "tags: $tags"

      # 1) Build into the local daemon: nothing is published yet.
      - name: Build ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/miner.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.tags.outputs.local }}
          build-args: BUILD_SHA=${{ needs.gate.outputs.ref }}
          # The registry cache survives the 10 GB Actions-cache cap that a CUDA
          # stack blows through; read on every build, written only when publishing.
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache-${{ matrix.target }}
          cache-to: ${{ needs.gate.outputs.push == 'true' && format('type=registry,ref={0}:buildcache-{1},mode=max', steps.tags.outputs.image, matrix.target) || '' }}
          provenance: false

      # 2) Smoke-test the exact image that would ship.
      - name: Smoke test
        run: bash deploy/miner-smoke.sh "${{ steps.tags.outputs.local }}" "${{ matrix.target }}"

      # 3) Only a passing image is published (same build, fully cached: fast).
      - name: Publish
        id: publish
        if: needs.gate.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/miner.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: BUILD_SHA=${{ needs.gate.outputs.ref }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache-${{ matrix.target }}
          provenance: false

      - name: Report
        if: always()
        run: |
          {
            echo "### cascade-miner (${{ matrix.target }})"
            echo ""
            echo "- event: \`${{ github.event_name }}\`, commit \`${{ needs.gate.outputs.ref }}\`"
            echo "- published: **${{ needs.gate.outputs.push == 'true' && steps.publish.outcome == 'success' }}**"
            if [ -n "${{ steps.publish.outputs.digest }}" ]; then
              echo "- digest: \`${{ steps.publish.outputs.digest }}\`"
            fi
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
