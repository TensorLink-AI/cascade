# Lane D loop gate (plan §3 conventions, §3.1 rules 1 and 6, §17; built by W0c).
#
# pull_request labelled laned:<WP>: `scripts/laned/accept <WP> --check-pr`
#   (rule 1: tests/accept/ never together with another path; an implementation
#   PR stays inside the WP's PATHS), then --expect-fail on a tests-only PR or
#   the full Accept on an implementation PR. The tooling comes from the base
#   branch once it exists there, so a PR cannot loosen its own gate.
# push to main: Accept for every WP at >= L2 (with `--evidence <file>` from the
#   WP's Accept cell when that file exists, so the WP's tests verify it via
#   LANED_EVIDENCE), `accept --gate` for every stage gate file present (both
#   record the verified blob sha in the ledger), then `scripts/laned/status`
#   recomputes the board and pushes it to branch laned/build-state (never main).
# workflow_dispatch: an expect-fail run of one WP at a given commit (bootstrap
#   for WPs whose tests landed before this workflow existed). The harvester keeps
#   that result when the commit is an ancestor of the dispatched ref's head.
#
# Only GITHUB_TOKEN is used. Per-WP results travel as the `laned-results`
# artifact and are kept in status/ci_runs.json on laned/build-state.
name: laned-accept

on:
  pull_request:
    types: [opened, reopened, labeled, synchronize]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wp:
        description: "WP id (for example W0c)"
        required: true
      sha:
        description: "commit to run the WP's tests at (the tests-only merge)"
        required: true

permissions:
  contents: read

jobs:
  pr:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: laned-accept-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}

      - name: Results file
        run: echo "LANED_RESULTS=$RUNNER_TEMP/laned-results/results.json" >> "$GITHUB_ENV"

      - name: Select WPs from laned:<WP> labels
        id: select
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH_WP: ${{ inputs.wp }}
        run: |
          if [ -n "$DISPATCH_WP" ]; then
            wps="$DISPATCH_WP"
          else
            wps=$(python3 -c 'import json, os; print(" ".join(l.split(":", 1)[1] for l in json.loads(os.environ["LABELS"] or "[]") if l.startswith("laned:")))')
          fi
          echo "wps=$wps" >> "$GITHUB_OUTPUT"
          echo "WPs: ${wps:-none (no laned:<WP> label; nothing to check)}"

      - name: Prepare isolated TLS trust for the CI job
        if: steps.select.outputs.wps != ''
        run: python3 scripts/prepare_ci_tls.py "$RUNNER_TEMP/cascade-ca" >> "$GITHUB_ENV"

      - name: Install uv
        if: steps.select.outputs.wps != ''
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Check system TLS trust before Git dependency fetches
        if: steps.select.outputs.wps != ''
        run: uv run --no-project --python 3.11 python scripts/check_tls_trust.py --system-only

      - name: Sync (frozen, all extras)
        if: steps.select.outputs.wps != ''
        run: uv sync --frozen --all-extras

      - name: Use the base branch's loop tooling when it has one
        if: steps.select.outputs.wps != ''
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          tools="$RUNNER_TEMP/laned-tools"
          mkdir -p "$tools"
          if git cat-file -e "origin/$BASE_REF:scripts/laned/accept" 2>/dev/null; then
            git archive "origin/$BASE_REF" scripts/laned | tar -x -C "$tools"
            echo "tooling: origin/$BASE_REF"
          else
            mkdir -p "$tools/scripts" && cp -r scripts/laned "$tools/scripts/"
            echo "tooling: this PR (none on origin/$BASE_REF yet)"
          fi
          echo "LANED=$tools/scripts/laned" >> "$GITHUB_ENV"

      - name: Accept (check-pr, then expect-fail or accept)
        if: steps.select.outputs.wps != ''
        env:
          WPS: ${{ steps.select.outputs.wps }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.sha }}
          RUN_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
        run: |
          mkdir -p "$(dirname "$LANED_RESULTS")"
          # workflow_dispatch: the entry carries the `sha` input, not the run's
          # head; record the run's head so the harvester can cross-check it.
          run_head=(); [ -n "$RUN_HEAD_SHA" ] && run_head=(--run-head-sha "$RUN_HEAD_SHA")
          status=0
          for wp in $WPS; do
            echo "::group::$wp"
            if [ "$EVENT" = "workflow_dispatch" ]; then
              mode=tests-only
            elif out=$(python3 "$LANED/accept" "$wp" --check-pr --base HEAD^1 --head HEAD --root .); then
              echo "$out"
              mode=$(echo "$out" | sed -n 's/^MODE //p')
            else
              echo "$out"
              python3 "$LANED/ci_ledger.py" record --file "$LANED_RESULTS" --wp "$wp" --mode check-pr \
                --event "$EVENT" --head-sha "$HEAD_SHA" --conclusion failure
              status=1; echo "::endgroup::"; continue
            fi
            if [ "$mode" = "review" ]; then
              # laned:RV<n>: check-pr already verified the diff is exactly
              # evidence/rv<n>.md; a review PR has no tests to run.
              python3 "$LANED/ci_ledger.py" record --file "$LANED_RESULTS" --wp "$wp" --mode check-pr \
                --event "$EVENT" --head-sha "$HEAD_SHA" --conclusion success
              echo "::endgroup::"; continue
            fi
            if [ "$mode" = "tests-only" ]; then
              run_mode=expect-fail
              uv run --frozen python "$LANED/accept" "$wp" --expect-fail --root . && rc=0 || rc=$?
            else
              run_mode=accept
              uv run --frozen python "$LANED/accept" "$wp" --root . && rc=0 || rc=$?
            fi
            [ "$rc" = 0 ] && conclusion=success || { conclusion=failure; status=1; }
            python3 "$LANED/ci_ledger.py" record --file "$LANED_RESULTS" --wp "$wp" --mode "$run_mode" \
              --event "$EVENT" --head-sha "$HEAD_SHA" --conclusion "$conclusion" "${run_head[@]}"
            echo "::endgroup::"
          done
          exit $status

      - name: Loop tooling self-tests (W0c PRs)
        if: contains(format(' {0} ', steps.select.outputs.wps), ' W0c ')
        run: |
          python3 scripts/laned/ci_ledger.py selftest
          python3 scripts/laned/accept selftest
          uv run --frozen python scripts/laned/status selftest

      - name: Upload per-WP results
        if: always() && steps.select.outputs.wps != ''
        uses: actions/upload-artifact@v4
        with:
          name: laned-results
          path: ${{ env.LANED_RESULTS }}
          if-no-files-found: ignore

  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # push the board to laned/build-state (never main)
      actions: read     # read laned-results artifacts for the ledger
    concurrency:
      group: laned-build-state
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      RELEASE_TAG_GLOB: ${{ vars.LANED_RELEASE_TAG_GLOB }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Results file
        run: echo "LANED_RESULTS=$RUNNER_TEMP/laned-results/results.json" >> "$GITHUB_ENV"

      - name: Prepare isolated TLS trust for the CI job
        run: python3 scripts/prepare_ci_tls.py "$RUNNER_TEMP/cascade-ca" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Check system TLS trust before Git dependency fetches
        run: uv run --no-project --python 3.11 python scripts/check_tls_trust.py --system-only

      - name: Sync (frozen, all extras)
        run: uv sync --frozen --all-extras

      - name: Harvest the CI results ledger
        run: |
          python3 scripts/laned/ci_ledger.py harvest --repo "$GITHUB_REPOSITORY" \
            --ledger-ref origin/laned/build-state --out "$LANED_RESULTS"

      - name: Accept every WP at >= L2
        run: |
          tag_args=(); [ -n "$RELEASE_TAG_GLOB" ] && tag_args=(--release-tag-glob "$RELEASE_TAG_GLOB")
          python3 scripts/laned/status --root . --ref "$GITHUB_SHA" --ci-results "$LANED_RESULTS" \
            --out "$RUNNER_TEMP/pre" "${tag_args[@]}"
          board="$RUNNER_TEMP/pre/status/laned_build.json"
          # "<WP> <evidence file or ->" for every WP at >= L2; the evidence file
          # is the one named in the WP's §3.0 Accept cell (external WPs only).
          rows=$(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("\n".join(w + " " + (v.get("evidence_file") or "-") for w, v in d["wps"].items() if int(v["level"][1:]) >= 2))' "$board")
          echo "WPs at >= L2: ${rows:-none}"
          status=0
          while read -r wp ev; do
            [ -n "$wp" ] || continue
            echo "::group::$wp"
            # L4: an external WP whose evidence file exists at this commit is
            # accepted WITH it, so its own tests verify the content
            # (LANED_EVIDENCE); the blob sha goes into the ledger.
            ev_args=(); ev_sha=()
            if [ "$ev" != "-" ] && [ -f "$ev" ]; then
              ev_args=(--evidence "$ev")
              ev_sha=(--evidence-sha "$(git rev-parse "HEAD:$ev")")
            fi
            uv run --frozen python scripts/laned/accept "$wp" --root . "${ev_args[@]}" && conclusion=success || { conclusion=failure; status=1; }
            python3 scripts/laned/ci_ledger.py record --file "$LANED_RESULTS" --wp "$wp" --mode accept \
              --event push --head-sha "$GITHUB_SHA" --conclusion "$conclusion" --run-id "$GITHUB_RUN_ID" "${ev_sha[@]}"
            echo "::endgroup::"
          done <<< "$rows"
          # §17.2: every stage gate file present is verified by a gate run
          # (stages whose gate is evidence/gates/<stage>.json, from the board).
          gates=$(python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); print("\n".join(s + " " + v["gate"]["evidence"] for s, v in d["stages"].items() if v["gate"]["evidence"].startswith("evidence/gates/")))' "$board")
          while read -r stage gf; do
            [ -n "$stage" ] && [ -f "$gf" ] || continue
            echo "::group::gate $stage"
            python3 scripts/laned/accept --gate "$stage" --root . && conclusion=success || conclusion=failure
            python3 scripts/laned/ci_ledger.py record --file "$LANED_RESULTS" --wp "$stage" --mode gate \
              --event push --head-sha "$GITHUB_SHA" --conclusion "$conclusion" --run-id "$GITHUB_RUN_ID" \
              --evidence-sha "$(git rev-parse "HEAD:$gf")"
            echo "::endgroup::"
          done <<< "$gates"
          echo "ACCEPT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Publish the status board to laned/build-state
        run: |
          tag_args=(); [ -n "$RELEASE_TAG_GLOB" ] && tag_args=(--release-tag-glob "$RELEASE_TAG_GLOB")
          python3 scripts/laned/status --root . --ref "$GITHUB_SHA" --ci-results "$LANED_RESULTS" \
            --out "$RUNNER_TEMP/board" "${tag_args[@]}" \
            --push origin --include "$LANED_RESULTS:status/ci_runs.json"
          cat "$RUNNER_TEMP/board/docs/plans/STATUS.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when any Accept failed
        run: exit "${ACCEPT_STATUS:-1}"
