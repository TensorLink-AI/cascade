[telemetry]
# Host-side run telemetry (cascade.trainer.host_probe). Observability only — never
# feeds scoring, weights, or contract_digest. The wall prices generator speed
# (DEC-CA-0001) on a per-round rented fleet, so a slow run needs host-side
# evidence to separate the pod from the submission; data_wait_frac only rules out
# the corpus. host_bench times a fixed calibration workload before each run's
# corpus stream opens — the one field that is comparable pod to pod.
host_probe = true               # lane geometry, CPU/GPU capability, opaque pod + machine ids
host_bench = true               # + the fixed calibration bench (host_bench_tokens_per_s)
# Payer-pod bench (DEC-CA-0036): each funded challenger benches on its own pod
# after the duel (miner-billed, ~1h; the pod is torn down when the sweep ends).
# Payer numbers are a FILTER: the top-N re-bench on the operator's king pod and
# only the operator's numbers are signed/published; a payer number better than
# the re-bench by more than the tolerance is a forged sweep (entry dropped).
funded_bench = true
funded_bench_verify_top = 1
funded_bench_verify_tolerance = 0.02
# Retired (ignored): the scratch-shadow leg rode the boundary-round bench
# thread (DEC-CA-0014 Stage 1 needs a rolling port to come back).
scratch_shadow_every_rounds = 2
# bench_anneal_fraction = 0.15  # bench-anneal (DEC-CA-0030): bench the annealed copy of each duel
                                # checkpoint (see mainnet chain.toml for the full note). Trainer
                                # restart only; arm here first and check the round's BenchScores
                                # step down (finished form scores lower) before mainnet.

