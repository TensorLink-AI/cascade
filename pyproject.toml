[project]
name = "cascade"
version = "0.0.1"
description = "Bittensor subnet for synthetic time-series training data, evaluated king-of-the-hill by training a fixed base model on each generator and scoring CRPS + MASE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tensorlink-ai" }]

dependencies = [
    "certifi>=2026.10.19",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",   # auto-load a gitignored .env (credentials) at CLI startup
]

[project.optional-dependencies]
# Heavy ML stack for training/evaluation; the generation extra also supplies
# torch for CPU-only priors such as gpytorch generators.
# torch is PINNED EXACTLY (not a range) + sourced from a fixed CUDA index below:
# a KOTH duel compares king vs challenger, so every pod MUST run bit-identical
# numerics. An unpinned `torch>=2.2` let fresh `uv sync`s resolve to whatever was
# latest (2.4.1 on old pods, 2.12.1 on new) and auto-pick the CUDA build per host
# (cu124 vs cu130) — silent drift that invalidates the comparison. See also
# .python-version (pins the interpreter, else uv grabs the newest available).
train = [
    "torch==2.4.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "accelerate>=0.30",
]
# Hippius storage: registry (Hippius Hub OCI, hippius_hub) for models/
# checkpoints/generators + S3 (boto3) for manifests and training logs. The
# trainer, validator, and the miner `deploy` need this; the core stays
# installable without it.
hippius = [
    "hippius-hub",
    "huggingface_hub>=0.23",   # for hf:-pinned genesis/eval refs in fetch_from_hub
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]
# tsbench-forge pool source (producer/orchestrator side only): reads the forge
# scraper's parquet mirror. Validators never need this — they consume the
# built .npy pool.
pool-forge = [
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
]
# CPU generation tier (DEC-CA-0053): parquet corpus shards. The CPU VM, the
# orchestrator and every GPU pod that reads a `shards` corpus need this.
generation = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pyarrow==25.0.0",
    "torch==2.4.1",
    "pandas==3.0.3",
    "networkx==3.6.1",
    "numba==0.66.0",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "gpytorch==1.15.2",
]
# Ephemeral GPU-pod provisioner (deploy/provision.py). Shells out to the `lium`
# CLI (installed separately) and calls the Shadeform REST API via requests.
deploy = [
    "requests>=2.31",
]
# Optional live training dashboards (Weights & Biases). Observability only —
# the trainer mirrors its per-step S3 log into a wandb run so miners can watch
# training as it occurs. Off unless [wandb] enabled = true in chain.toml.
wandb = [
    "wandb>=0.17",
]
# MarketCast (DEC-CA-0064): the Timestral inference library the MAIN
# validator (GPU scoring) and MarketCast training pods load the pinned
# Timestral-28M base with. Not on PyPI: pinned to an exact commit of
# github.com/mistralai/timestral (version 1.0.0, Apache-2.0 code; the model
# weights are Modified-MIT with a revenue restriction). Needs torch from the
# [train] extra (timestral requires torch>=2.4; the pin is 2.4.1).
#   pip install -e ".[train,hippius,marketcast]"
marketcast = [
    "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
]
chain = [
    # Bittensor stack pulled in only where needed (validator, trainer, miner CLI).
    # PINNED exactly: the timelock-reveal encoding differs across SDK lines —
    # v8-era set_reveal_commitment writes reveals the netuid's decoder cannot
    # read (raw bytes where hex is expected), so a miner on the wrong SDK
    # commits successfully yet is skipped every round ("non-hexadecimal
    # number found in fromhex()").
    # 11.3.0 (DEC-CA-0051) is a ground-up rewrite with two silent traps that
    # cascade/shared/chain.py routes around — do not "simplify" them away:
    #  * reveal encoding: v11's high-level ``bittensor.timelock.encrypt()``
    #    seals RAW UTF-8 (no SCALE compact-length prefix), so the netuid's
    #    decoder strips a real byte and the miner is skipped every round.
    #    The commit path uses ``bittensor_core.get_encrypted_commitment``
    #    (byte-identical to 10.5's bittensor_drand) — never timelock.encrypt.
    #  * stake: ``neurons.all(...).total_stake`` is NOT 10.5's ``metagraph.S``;
    #    the DEC-CA-0045 activation tally reads
    #    ``bittensor.metagraph.fetch(...).neurons[i].total_stake`` (== S).
    # Weights are cast to float32 before the v11 u16 quantiser so vectors stay
    # bit-identical with 10.5 validators.
    "bittensor==11.3.0",
    # 10.5 pulled requests in transitively; 11.x does not. The chain-holding
    # services (trainer → cascade.provision.core's Lium/Shadeform REST calls,
    # provisioner) import it lazily, so it is declared here and in [deploy].
    "requests>=2.31",
]

# Satellite validator (DEC-CA-0058): replays the main validator's signed
# receipts — storage + chain only, never the [train] extra (no torch).
#   pip install -e ".[satellite]"   (== ".[hippius,chain]")
satellite = [
    "cascade[hippius,chain]",
]

[project.scripts]
cascade = "cascade.miner.cli:main"
cascade-trainer = "cascade.trainer.main:main"
cascade-provisioner = "cascade.provision.main:main"
cascade-train-worker = "cascade.trainer.worker:main"
cascade-validator = "cascade.validator.main:main"
cascade-satellite = "cascade.validator.satellite:main"
cascade-pool = "cascade.pool.cli:main"
cascade-audit = "cascade.audit.main:main"
cascade-intake = "cascade.funding.main:main"
cascade-generate = "cascade.generation.cli:main"

# Pin torch to a single CUDA build (cu124) so every worker/validator resolves the
# SAME wheel regardless of the host's CUDA version — uv would otherwise auto-select
# the backend per machine (cu124 on one pod, cu130 on another). cu124 wheels run
# on newer CUDA runtimes (backward-compatible), so this is safe across SKUs.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# the [marketcast] extra pins timestral by git commit (a direct reference)
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cascade"]

[tool.hatch.build.targets.wheel.force-include]
"chain.toml" = "cascade/data/chain.toml"
"chain.testnet.toml" = "cascade/data/chain.testnet.toml"
"docs/AGENT_MINING.md" = "cascade/data/AGENT_MINING.md"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "requires_torch: needs a working torch install (skipped in CPU-only minimal envs)",
    "requires_chain: needs a running subtensor / bittensor; skipped by default",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
